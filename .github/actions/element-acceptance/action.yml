name: Element acceptance fixture runner
description: Run the pinned Element acceptance suite against the isolated Element fixture.
inputs:
  principal-mode:
    description: Process-wide room principal mode for this isolated acceptance run.
    required: true
  private-ui:
    description: Run the opt-in private calendar app UI and CalDAV lifecycle.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Mask synthetic service credentials and prepare private files
      env:
        PRINCIPAL_MODE: ${{ inputs.principal-mode }}
        PRIVATE_UI: ${{ inputs.private-ui }}
      shell: bash
      run: |
        if [[ "$PRIVATE_UI" == true ]]; then
          if [[ ! -f "$GITHUB_ENV" || -L "$GITHUB_ENV" || ! -O "$GITHUB_ENV" ]]; then
            echo 'The private acceptance environment file is not a runner-owned regular file.' >&2
            exit 1
          fi
          chmod 0600 -- "$GITHUB_ENV"
        fi
        case "$PRINCIPAL_MODE" in
          appservice)
            if [[ -z "${MATRIX_APPLICATION_SERVICE_TOKEN:-}" || ${#MATRIX_APPLICATION_SERVICE_TOKEN} -gt 4096 || "${MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION:-enabled}" != enabled ]]; then
              echo 'The appservice acceptance run requires its bounded synthetic AS token and enabled registration.' >&2
              exit 1
            fi
            echo 'MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION=enabled' >> "$GITHUB_ENV"
            ;;
          bot-account)
            if [[ "${MATRIX_APPLICATION_SERVICE_TOKEN+x}" == x || "${MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION:-}" != disabled ]]; then
              echo 'The bot-account acceptance run requires AS credentials absent and registration disabled.' >&2
              exit 1
            fi
            echo 'MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION=disabled' >> "$GITHUB_ENV"
            echo 'MATRIX_APPLICATION_SERVICE_USER_ID=' >> "$GITHUB_ENV"
            ;;
          *)
            echo 'The acceptance principal mode is invalid.' >&2
            exit 1
            ;;
        esac
        case "$PRIVATE_UI" in
          true)
            echo 'ELEMENT_ACCEPTANCE_PRIVATE_UI=true' >> "$GITHUB_ENV"
            ;;
          false)
            ;;
          *)
            echo 'The private UI acceptance input must be true or false.' >&2
            exit 1
            ;;
        esac
        echo "ROOM_CALENDAR_PRINCIPAL_MODE=$PRINCIPAL_MODE" >> "$GITHUB_ENV"
        if [[ -n "${MATRIX_APPLICATION_SERVICE_TOKEN:-}" ]]; then
          echo "::add-mask::$MATRIX_APPLICATION_SERVICE_TOKEN"
        fi
        fixture_password="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
        echo "::add-mask::$fixture_password"
        echo "MATRIX_CALENDAR_DEV_PASSWORD=$fixture_password" >> "$GITHUB_ENV"
        echo "MATRIX_CALENDAR_DEV_SYNAPSE_PORT_MAPPING=127.0.0.1:8008:8008" >> "$GITHUB_ENV"
        echo "MATRIX_CALENDAR_DEV_RADICALE_PORT_MAPPING=127.0.0.1:5232:5232" >> "$GITHUB_ENV"
        compose_project_name="matrix-calendar-element-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        echo "COMPOSE_PROJECT_NAME=$compose_project_name" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_RESTORE_VOLUME_NAME=${compose_project_name}_radicale-restore" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_STAGE_FILE=$RUNNER_TEMP/element-acceptance-stage.jsonl" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_USERS_FILE=$RUNNER_TEMP/element-acceptance-users.json" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_SERVER_ENV_FILE=$RUNNER_TEMP/element-acceptance-server.env" >> "$GITHUB_ENV"
        echo "ELEMENT_DESKTOP_STAGE_FILE=$RUNNER_TEMP/element-desktop-startup-stage.jsonl" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_DESKTOP_CREDENTIALS_FILE=$RUNNER_TEMP/element-acceptance-desktop-credentials.json" >> "$GITHUB_ENV"
        echo "ELEMENT_DESKTOP_JOURNEY_STAGE_FILE=$RUNNER_TEMP/element-desktop-journey-stage.jsonl" >> "$GITHUB_ENV"
        echo "ELEMENT_DESKTOP_JOURNEY_PLAYWRIGHT_OUTPUT=$RUNNER_TEMP/element-desktop-journey-playwright-output" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_REMINDER_EVENT_FILE=$RUNNER_TEMP/element-acceptance-reminder-events.json" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_REMINDER_DELIVERY_FILE=$RUNNER_TEMP/element-acceptance-reminder-deliveries.json" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_PERFORMANCE_MANIFEST_FILE=$RUNNER_TEMP/element-acceptance-performance-events.json" >> "$GITHUB_ENV"
        echo "ELEMENT_ACCEPTANCE_PLAYWRIGHT_OUTPUT=$RUNNER_TEMP/element-acceptance-playwright-output" >> "$GITHUB_ENV"
        source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
        echo "ELEMENT_ACCEPTANCE_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
        echo "ELEMENT_DESKTOP_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
        : > "$RUNNER_TEMP/element-acceptance-stage.jsonl"
        printf '[]\n' > "$RUNNER_TEMP/element-acceptance-reminder-events.json"
        printf '[]\n' > "$RUNNER_TEMP/element-acceptance-performance-events.json"
        chmod 0600 "$RUNNER_TEMP/element-acceptance-stage.jsonl"
        chmod 0600 "$RUNNER_TEMP/element-acceptance-reminder-events.json"
        chmod 0600 "$RUNNER_TEMP/element-acceptance-performance-events.json"

    - name: Prepare opt-in private UI TLS profile
      if: ${{ inputs.private-ui == 'true' }}
      shell: bash
      run: |
        if [[ ! -f "$GITHUB_ENV" || -L "$GITHUB_ENV" || ! -O "$GITHUB_ENV" ]]; then
          echo 'The private acceptance environment file is not a runner-owned regular file.' >&2
          exit 1
        fi
        chmod 0600 -- "$GITHUB_ENV"
        node dev/element-acceptance-private-ui-prepare.mjs

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Test bounded acceptance diagnostics and summary sanitizer
      shell: bash
      run: |
        node --test dev/element-acceptance-overrides.test.mjs
        node dev/element-acceptance-diagnostics.test.mjs
        node dev/sanitize-element-acceptance.test.mjs
        node dev/element-reminder-all-day-readback.test.mjs
        node dev/element-desktop-egress-policy.test.mjs
        node dev/element-desktop-evidence.test.mjs
        node --test dev/element-desktop-startup.test.mjs
        node --test dev/element-desktop-journey.test.mjs
        node --test dev/element-desktop-frame-origin.test.mjs
        node --test dev/element-desktop-journey-runner.test.mjs
        node dev/element-acceptance-performance.test.mjs
        node dev/element-acceptance-performance-evidence.test.mjs
        node dev/element-acceptance-error-source-map.test.mjs
        node --test dev/element-acceptance-workflow.test.mjs
        node --test dev/element-acceptance-action-summary.test.mjs
        node --test dev/element-acceptance-setup.test.mjs
        node --test dev/element-acceptance-private-ui-prepare.test.mjs
        node --test dev/validate-element-acceptance-compose.test.mjs

    - name: Build calendar, server, and widget outputs
      shell: bash
      run: |
        yarn workspace @matrix-calendar-widget/ical-timezones build
        yarn workspace @matrix-calendar-widget/calendar build
        node --test dev/element-acceptance-reminder-timing.test.mjs
        yarn workspace @matrix-calendar-widget/server build
        node --test dev/element-acceptance-caldav-report-probe.test.mjs
        yarn workspace @matrix-calendar-widget/widget build
        docker build \
          --tag matrix-calendar-widget/server:element-acceptance \
          --file matrix-calendar-server/Dockerfile \
          .
        docker build \
          --build-context root=. \
          --tag matrix-calendar-widget/widget:element-acceptance \
          --file matrix-calendar-widget/Dockerfile \
          matrix-calendar-widget
        server_cmd="$(docker image inspect --format '{{json .Config.Cmd}}' matrix-calendar-widget/server:element-acceptance)"
        if [[ "$server_cmd" != '["node","./lib/src/index.js"]' ]]; then
          echo 'The built server image does not use the compiled entrypoint.' >&2
          exit 1
        fi
        if ! docker run --rm --network none --read-only --ulimit core=0 \
          --mount "type=bind,source=$GITHUB_WORKSPACE/dev/element-acceptance-image-smoke.mjs,target=/tmp/element-acceptance-image-smoke.mjs,readonly" \
          --entrypoint node matrix-calendar-widget/server:element-acceptance \
          /tmp/element-acceptance-image-smoke.mjs \
          > "$RUNNER_TEMP/element-acceptance-image-smoke.log" 2>&1; then
          echo 'The isolated server image failed its compiled entrypoint smoke.' >&2
          exit 1
        fi

    - name: Install isolated Chromium
      shell: bash
      run: yarn workspace e2e playwright install --with-deps chromium --only-shell

    - name: Validate loopback-only Synapse and Radicale ports
      shell: bash
      run: |
        if ! docker compose -p "$COMPOSE_PROJECT_NAME" -f dev/compose.yaml config --format json 2>/dev/null | node dev/validate-element-acceptance-compose.mjs; then
          echo 'Synthetic Synapse and Radicale ports must bind to loopback.' >&2
          exit 1
        fi

    - name: Start isolated Synapse and Radicale fixture
      shell: bash
      run: |
        if ! bash dev/up.sh > "$RUNNER_TEMP/element-acceptance-dev-up.log" 2>&1; then
          printf '%s\n' '{"phase":"runtime-ready","status":"failed"}' >> "$ELEMENT_ACCEPTANCE_STAGE_FILE"
          echo 'Synthetic Matrix and CalDAV fixture startup failed.' >&2
          exit 1
        fi

    - name: Provision three synthetic users and the isolated calendar
      shell: bash
      run: node dev/element-acceptance-setup.mjs setup

    - name: Validate and start the project gateway, widget, and pinned Element
      shell: bash
      run: |
        compose=(docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$ELEMENT_ACCEPTANCE_SERVER_ENV_FILE" -f dev/compose.yaml -f dev/element-acceptance.compose.yaml)
        if [[ "${ELEMENT_ACCEPTANCE_PRIVATE_UI:-false}" == true ]]; then
          compose+=(-f dev/element-acceptance-reminder.compose.yaml --env-file "$ELEMENT_ACCEPTANCE_PRIVATE_UI_ENV_FILE" -f dev/element-acceptance-private-ui-tls.compose.yaml -f dev/element-acceptance-private-ui.compose.yaml)
        fi
        if ! "${compose[@]}" config --quiet >/dev/null 2>&1; then
          printf '%s\n' '{"phase":"runtime-ready","status":"failed"}' >> "$ELEMENT_ACCEPTANCE_STAGE_FILE"
          echo 'Synthetic Element stack configuration is invalid.' >&2
          exit 1
        fi
        if ! "${compose[@]}" config --format json 2>/dev/null | node dev/validate-element-acceptance-compose.mjs; then
          printf '%s\n' '{"phase":"runtime-ready","status":"failed"}' >> "$ELEMENT_ACCEPTANCE_STAGE_FILE"
          echo 'Synthetic service ports must bind to loopback.' >&2
          exit 1
        fi
        services=(gateway widget element)
        if [[ "${ELEMENT_ACCEPTANCE_PRIVATE_UI:-false}" == true ]]; then
          services+=(postgres private-gateway-https)
        fi
        if ! "${compose[@]}" up --no-build -d "${services[@]}" > "$RUNNER_TEMP/element-acceptance-compose-up.log" 2>&1; then
          printf '%s\n' '{"phase":"runtime-ready","status":"failed"}' >> "$ELEMENT_ACCEPTANCE_STAGE_FILE"
          echo 'Synthetic Element stack startup failed.' >&2
          exit 1
        fi
        node dev/element-acceptance-setup.mjs wait

    - name: Run the opt-in private app UI and CalDAV lifecycle
      if: ${{ inputs.private-ui == 'true' }}
      shell: bash
      run: |
        umask 077
        if ! yarn workspace e2e playwright test --config playwright.element-acceptance.config.ts --grep "Element Web manages private app access and revokes CalDAV authorization" > "$RUNNER_TEMP/element-acceptance-private-ui-playwright.log" 2>&1; then
          echo 'Private calendar app UI and CalDAV acceptance failed; see the sanitized phase result.' >&2
          exit 1
        fi

    - name: Measure the real Element Web ordinary 0-and-25-event profiles
      shell: bash
      run: |
        if ! yarn workspace e2e playwright test --config playwright.element-acceptance.config.ts --grep "Element Web measures the ordinary 0-and-25-event calendar profile" > "$RUNNER_TEMP/element-acceptance-playwright.log" 2>&1; then
          echo 'Element Web ordinary performance profile failed; see sanitized phase summary.' >&2
          exit 1
        fi

    - name: Remove the synthetic ordinary performance events
      if: always()
      shell: bash
      run: node dev/element-acceptance-performance.mjs cleanup

    - name: Run the real Element Web member and outsider journey
      id: web_member_outsider_journey
      shell: bash
      run: |
        journey_started_at_ms="$(date +%s%3N)"
        printf '%s\n' '{"phase":"browser-test-suite","status":"started"}' >> "$ELEMENT_ACCEPTANCE_STAGE_FILE"
        playwright_env=()
        if [[ "${ELEMENT_ACCEPTANCE_PRIVATE_UI:-false}" == true ]]; then
          playwright_env+=("NODE_EXTRA_CA_CERTS=$ELEMENT_ACCEPTANCE_PRIVATE_TLS_DIR/ca.pem")
        fi
        if ! env "${playwright_env[@]}" yarn workspace e2e playwright test --config playwright.element-acceptance.config.ts --grep "Element Web members share events and enforce room authorization" > "$RUNNER_TEMP/element-acceptance-playwright.log" 2>&1; then
          journey_outcome=failure
        else
          journey_outcome=success
          printf '%s\n' '{"phase":"browser-test-suite","status":"passed"}' >> "$ELEMENT_ACCEPTANCE_STAGE_FILE"
        fi
        journey_finished_at_ms="$(date +%s%3N)"
        journey_elapsed_ms=$((journey_finished_at_ms - journey_started_at_ms))
        if [[ "$journey_elapsed_ms" -lt 0 ]]; then journey_elapsed_ms=0; fi
        printf 'ELEMENT_ACCEPTANCE_WEB_MEMBER_OUTSIDER_JOURNEY_ELAPSED_MS=%s\n' "$journey_elapsed_ms" >> "$GITHUB_ENV"
        printf 'ELEMENT_ACCEPTANCE_PHASE_WEB_MEMBER_OUTSIDER_JOURNEY=%s\n' "$journey_outcome" >> "$GITHUB_ENV"
        if [[ "$journey_outcome" == failure ]]; then
          printf '%s\n' '{"phase":"browser-test-suite","status":"failed"}' >> "$ELEMENT_ACCEPTANCE_STAGE_FILE"
          echo 'Element Web acceptance journey failed; see sanitized phase summary.' >&2
          exit 1
        fi

    - name: Run the packaged Element Desktop shared-calendar journey
      id: desktop_journey
      if: ${{ inputs.private-ui != 'true' }}
      shell: bash
      run: node dev/element-desktop-journey-runner.mjs journey

    - name: Clean up the packaged Element Desktop journey
      id: desktop_journey_cleanup
      if: ${{ always() && steps.desktop_journey.outcome != 'skipped' }}
      shell: bash
      run: node dev/element-desktop-journey-runner.mjs cleanup

    - name: Provision the synthetic reminder sender room membership
      id: reminder_room
      shell: bash
      run: node dev/element-acceptance-setup.mjs reminder-room

    - name: Enable the PostgreSQL-backed reminder fixture
      id: reminder_enable
      shell: bash
      run: node dev/element-acceptance-reminder-restore.mjs enable

    - name: Verify real UI reminder delivery
      id: reminder_initial
      shell: bash
      run: |
        if ! ELEMENT_ACCEPTANCE_REMINDER_FLOW=initial yarn workspace e2e playwright test --config playwright.element-acceptance.config.ts --grep "Element Web delivers room-timed and selected-member all-day reminders across restart and restore" > "$RUNNER_TEMP/element-acceptance-playwright.log" 2>&1; then
          echo 'Initial reminder delivery failed; see sanitized phase summary.' >&2
          exit 1
        fi
        node dev/element-acceptance-reminder-restore.mjs verify-configuration
        node dev/element-acceptance-reminder-restore.mjs snapshot

    - name: Restart the gateway and verify reminder scheduling
      id: reminder_restart
      shell: bash
      run: |
        node dev/element-acceptance-reminder-restore.mjs restart
        if ! ELEMENT_ACCEPTANCE_REMINDER_FLOW=restart yarn workspace e2e playwright test --config playwright.element-acceptance.config.ts --grep "Element Web delivers room-timed and selected-member all-day reminders across restart and restore" > "$RUNNER_TEMP/element-acceptance-playwright.log" 2>&1; then
          echo 'Post-restart reminder delivery failed; see sanitized phase summary.' >&2
          exit 1
        fi
        node dev/element-acceptance-reminder-restore.mjs verify-configuration
        node dev/element-acceptance-reminder-restore.mjs verify-restart
        node dev/element-acceptance-reminder-restore.mjs snapshot

    - name: Restore paired Radicale and PostgreSQL stores
      id: reminder_restore
      shell: bash
      run: |
        node dev/element-acceptance-reminder-restore.mjs restore
        if ! ELEMENT_ACCEPTANCE_REMINDER_FLOW=restore yarn workspace e2e playwright test --config playwright.element-acceptance.config.ts --grep "Element Web delivers room-timed and selected-member all-day reminders across restart and restore" > "$RUNNER_TEMP/element-acceptance-playwright.log" 2>&1; then
          echo 'Post-restore reminder delivery failed; see sanitized phase summary.' >&2
          exit 1
        fi
        node dev/element-acceptance-reminder-restore.mjs verify-restore

    - name: Verify Element Web client interactions and preservation
      id: web_client_interactions
      shell: bash
      run: |
        if ! yarn workspace e2e playwright test --config playwright.element-acceptance.config.ts --grep "Element Web preserves unsupported events and supports client interactions" > "$RUNNER_TEMP/element-acceptance-playwright.log" 2>&1; then
          echo 'Element Web client acceptance cases failed; see sanitized phase summary.' >&2
          exit 1
        fi

    - name: Emit sanitized acceptance summary
      id: web_acceptance_summary
      if: always()
      shell: bash
      run: |
        node dev/sanitize-element-acceptance.mjs \
          "$ELEMENT_ACCEPTANCE_STAGE_FILE" \
          "$ELEMENT_ACCEPTANCE_SOURCE_SHA" \
          > "$RUNNER_TEMP/element-acceptance-safe-summary.txt"

    - name: Emit finite Desktop journey summary
      id: desktop_journey_summary
      if: ${{ always() && steps.desktop_journey.outcome != 'skipped' }}
      shell: bash
      run: |
        node dev/element-desktop-journey.mjs summary \
          > "$RUNNER_TEMP/element-desktop-journey-safe-summary.txt"

    - name: Retain finite Desktop journey summary
      if: ${{ always() && steps.desktop_journey.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.principal-mode == 'appservice' && 'element-desktop-journey-summary' || 'element-desktop-journey-normal-bot-summary' }}
        path: ${{ runner.temp }}/element-desktop-journey-safe-summary.txt
        if-no-files-found: ignore
        retention-days: 1

    - name: Sanitize Desktop startup and network-isolation evidence
      id: desktop_startup_summary
      if: ${{ always() && steps.desktop_journey.outcome != 'skipped' }}
      shell: bash
      run: |
        summary_file="$RUNNER_TEMP/element-desktop-startup-safe-summary.json"
        node dev/element-desktop-evidence.mjs \
          "$ELEMENT_DESKTOP_STAGE_FILE" \
          "$ELEMENT_DESKTOP_SOURCE_SHA" > "$summary_file"
        node --input-type=module - "$summary_file" <<'NODE'
        import { readFileSync } from 'node:fs';
        const [path] = process.argv.slice(2);
        const summary = JSON.parse(readFileSync(path, 'utf8'));
        if (summary.status !== 'passed') process.exit(1);
        NODE

    - name: Retain sanitized Desktop startup evidence
      if: ${{ always() && steps.desktop_journey.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.principal-mode == 'appservice' && 'element-desktop-startup-summary' || 'element-desktop-startup-normal-bot-summary' }}
        path: ${{ runner.temp }}/element-desktop-startup-safe-summary.json
        if-no-files-found: ignore
        retention-days: 1

    - name: Stop and remove the isolated stack and private evidence
      id: acceptance_stack_cleanup
      if: always()
      shell: bash
      run: |
        compose_cleanup_status=not-needed
        if [[ -n "${COMPOSE_PROJECT_NAME:-}" ]]; then
          compose_cleanup_status=passed
          if [[ -f "${ELEMENT_ACCEPTANCE_SERVER_ENV_FILE:-}" ]]; then
            compose=(docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$ELEMENT_ACCEPTANCE_SERVER_ENV_FILE" -f dev/compose.yaml -f dev/element-acceptance.compose.yaml -f dev/element-acceptance-reminder.compose.yaml)
            if [[ "${ELEMENT_ACCEPTANCE_PRIVATE_UI:-false}" == true && -f "${ELEMENT_ACCEPTANCE_PRIVATE_UI_ENV_FILE:-}" ]]; then
              compose+=(--env-file "$ELEMENT_ACCEPTANCE_PRIVATE_UI_ENV_FILE" -f dev/element-acceptance-private-ui-tls.compose.yaml -f dev/element-acceptance-private-ui.compose.yaml)
            fi
            if ! "${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1; then
              compose_cleanup_status=failed
            fi
          else
            if ! docker compose -p "$COMPOSE_PROJECT_NAME" -f dev/compose.yaml down --volumes --remove-orphans >/dev/null 2>&1; then
              compose_cleanup_status=failed
            fi
          fi
        fi
        private_cleanup_status=passed
        if ! rm -rf \
          "$RUNNER_TEMP/element-acceptance-users.json" \
          "$RUNNER_TEMP/element-acceptance-server.env" \
          "$RUNNER_TEMP/element-desktop-journey-playwright-output" \
          "$RUNNER_TEMP/element-acceptance-reminder-events.json" \
          "$RUNNER_TEMP/element-acceptance-reminder-deliveries.json" \
          "$RUNNER_TEMP/element-acceptance-performance-events.json" \
          "$RUNNER_TEMP/element-acceptance-playwright-output"; then
          private_cleanup_status=failed
        fi
        if ! rm -rf "$RUNNER_TEMP/element-acceptance-private-ui"; then
          private_cleanup_status=failed
        fi
        if ! rm -f \
          "$RUNNER_TEMP/element-acceptance-stage.jsonl" \
          "$RUNNER_TEMP/element-acceptance-desktop-credentials.json" \
          "$RUNNER_TEMP/element-desktop-journey-stage.jsonl" \
          "$RUNNER_TEMP/element-desktop-journey-parent-diagnostic.json" \
          "$RUNNER_TEMP/element-desktop-startup-stage.jsonl" \
          "$RUNNER_TEMP/element-desktop-journey-runner-state.json" \
          "$RUNNER_TEMP/element-desktop-journey-startup-output.jsonl" \
          "$RUNNER_TEMP/element-desktop-journey-safe-summary.txt" \
          "$RUNNER_TEMP/element-desktop-startup-safe-summary.json" \
          "$RUNNER_TEMP/element-acceptance-radicale.tar" \
          "$RUNNER_TEMP/element-acceptance-reminder.pgcustom" \
          "$RUNNER_TEMP/element-acceptance-dev-up.log" \
          "$RUNNER_TEMP/element-acceptance-compose-up.log" \
          "$RUNNER_TEMP/element-acceptance-image-smoke.log" \
          "$RUNNER_TEMP/element-acceptance-playwright.log" \
          "$RUNNER_TEMP/element-acceptance-private-ui-playwright.log"; then
          private_cleanup_status=failed
        fi
        {
          echo "Compose teardown command: $compose_cleanup_status"
          echo "Private-file removal commands: $private_cleanup_status"
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$compose_cleanup_status" == failed || "$private_cleanup_status" == failed ]]; then
          echo 'Isolated acceptance cleanup failed.' >&2
          exit 1
        fi

    - name: Record bounded action phase summary
      if: always()
      continue-on-error: true
      env:
        ELEMENT_ACCEPTANCE_PHASE_WEB_MEMBER_OUTSIDER_JOURNEY: ${{ steps.web_member_outsider_journey.outcome }}
        ELEMENT_ACCEPTANCE_WEB_MEMBER_OUTSIDER_JOURNEY_ELAPSED_MS: ${{ env.ELEMENT_ACCEPTANCE_WEB_MEMBER_OUTSIDER_JOURNEY_ELAPSED_MS }}
        ELEMENT_ACCEPTANCE_PHASE_DESKTOP_JOURNEY: ${{ steps.desktop_journey.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_DESKTOP_JOURNEY_CLEANUP: ${{ steps.desktop_journey_cleanup.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_REMINDER_ROOM: ${{ steps.reminder_room.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_REMINDER_ENABLE: ${{ steps.reminder_enable.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_REMINDER_INITIAL: ${{ steps.reminder_initial.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_REMINDER_RESTART: ${{ steps.reminder_restart.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_REMINDER_RESTORE: ${{ steps.reminder_restore.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_WEB_CLIENT_INTERACTIONS: ${{ steps.web_client_interactions.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_WEB_ACCEPTANCE_SUMMARY: ${{ steps.web_acceptance_summary.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_DESKTOP_JOURNEY_SUMMARY: ${{ steps.desktop_journey_summary.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_DESKTOP_STARTUP_SUMMARY: ${{ steps.desktop_startup_summary.outcome }}
        ELEMENT_ACCEPTANCE_PHASE_ACCEPTANCE_STACK_CLEANUP: ${{ steps.acceptance_stack_cleanup.outcome }}
      shell: bash
      run: |
        if ! node dev/element-acceptance-action-summary.mjs \
          "$RUNNER_TEMP/element-acceptance-safe-summary.txt"; then
          printf '%s\n' 'Action phase metadata unavailable; the diagnostic writer failed.' >> "$GITHUB_STEP_SUMMARY" || true
          exit 1
        fi

    - name: Retain sanitized acceptance summary
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.principal-mode == 'appservice' && 'element-web-acceptance-summary' || 'element-web-acceptance-normal-bot-summary' }}
        path: ${{ runner.temp }}/element-acceptance-safe-summary.txt
        if-no-files-found: ignore
        retention-days: 1
