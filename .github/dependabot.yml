version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    # Keep compatibility migrations explicit and keep tightly-coupled tooling
    # in focused groups so a formatter/i18n/type change cannot block every
    # otherwise-routine dependency update.
    groups:
      formatter-updates:
        patterns:
          - prettier
          - prettier-plugin-organize-imports
        update-types:
          - minor
          - patch
      fullcalendar-updates:
        patterns:
          - '@fullcalendar/*'
        update-types:
          - minor
          - patch
      luxon-updates:
        patterns:
          - luxon
          - '@types/luxon'
        update-types:
          - minor
          - patch
      routine-npm-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
        exclude-patterns:
          - typescript
          - prettier
          - prettier-plugin-organize-imports
          - '@fullcalendar/*'
          - luxon
          - '@types/luxon'
          - i18next-cli
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    groups:
      routine-action-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
