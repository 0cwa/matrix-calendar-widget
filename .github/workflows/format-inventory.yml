name: Format inventory

on:
  push:
    branches:
      - chore/agent-scaffold
    paths:
      - .github/workflows/format-inventory.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier --write docs/UPSTREAM_INVENTORY.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UPSTREAM_INVENTORY.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format upstream inventory"
          git push origin HEAD:chore/agent-scaffold
