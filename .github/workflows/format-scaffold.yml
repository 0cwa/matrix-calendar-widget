name: Format scaffold

on:
  push:
    branches:
      - chore/agent-scaffold
    paths:
      - .github/workflows/format-scaffold.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format scaffold files
        run: yarn prettier --write .github/dependabot.yml docs/ARCHITECTURE.md docs/ROADMAP.md

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dependabot.yml docs/ARCHITECTURE.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format scaffold files"
          git push origin HEAD:chore/agent-scaffold
