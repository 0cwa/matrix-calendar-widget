name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn prettier:check

      - name: Check fork identity
        run: bash scripts/check-fork-identity.sh

      - name: Validate local integration stack
        run: |
          bash -n dev/up.sh
          docker compose -f dev/compose.yaml config >/dev/null

      - name: Check dependencies
        run: yarn depcheck

      - name: Type check
        run: yarn tsc

  widget:
    name: Widget
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build timezone data package
        run: yarn workspace @matrix-calendar-widget/ical-timezones build

      - name: Lint calendar package
        run: yarn workspace @matrix-calendar-widget/calendar lint

      - name: Test calendar package
        run: yarn workspace @matrix-calendar-widget/calendar test:all

      - name: Test timezone data package
        run: yarn workspace @matrix-calendar-widget/ical-timezones test:all

      - name: Build calendar package
        run: yarn workspace @matrix-calendar-widget/calendar build

      - name: Measure synthetic calendar projection
        run: node scripts/benchmark-calendar-projection.cjs

      - name: Lint widget
        run: yarn workspace @matrix-calendar-widget/widget lint

      - name: Check widget translations
        run: yarn workspace @matrix-calendar-widget/widget translate --ci --dry-run

      - name: Test widget
        run: yarn workspace @matrix-calendar-widget/widget test:all

      - name: Build widget
        run: yarn workspace @matrix-calendar-widget/widget build

  server:
    name: Server and bot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: reminder_bootstrap
          POSTGRES_PASSWORD: reminder_bootstrap_password
        options: >-
          --health-cmd "pg_isready -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint server
        run: yarn workspace @matrix-calendar-widget/server lint

      - name: Check server translations
        run: yarn workspace @matrix-calendar-widget/server translate --ci --dry-run

      - name: Test server Jest report sanitizer
        run: node --test dev/sanitize-server-test-report.test.mjs

      - name: Test server
        run: |
          report="$RUNNER_TEMP/server-test-results.json"
          safe_summary="$RUNNER_TEMP/server-safe-test-summary.txt"
          : > "$safe_summary"
          trap 'rm -f "$report"' EXIT
          set +e
          yarn workspace @matrix-calendar-widget/server test:all \
            --json --outputFile="$report" \
            >/dev/null 2>&1
          test_status=$?
          set -e
          set +e
          server_summary="$(node dev/sanitize-server-test-report.mjs "$report" "$test_status" 2>/dev/null)"
          summary_status=$?
          set -e
          printf '%s\n' "$server_summary" >> "$safe_summary"
          {
            printf '%s\n' 'Server and bot test summary'
            printf '%s\n' "$server_summary"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"

      - name: Upload sanitized server test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-safe-test-diagnostics
          path: ${{ runner.temp }}/server-safe-test-summary.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Provision restricted reminder test role
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16.15-alpine3.23' --format '{{.ID}}')"
          test -n "$container_id"
          test "$(printf '%s\n' "$container_id" | wc -l)" -eq 1
          docker exec "$container_id" psql --username reminder_bootstrap --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE ROLE matrix_calendar_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'matrix_calendar_test_password';"
          docker exec "$container_id" psql --username reminder_bootstrap --dbname postgres --set ON_ERROR_STOP=1 --command "REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;"
          docker exec "$container_id" psql --username reminder_bootstrap --dbname postgres --set ON_ERROR_STOP=1 --command "REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;"
          docker exec "$container_id" psql --username reminder_bootstrap --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE matrix_calendar_test OWNER matrix_calendar_app;"

      - name: Test PostgreSQL reminder store
        env:
          MATRIX_CALENDAR_REMINDER_DATABASE_URL: postgresql://matrix_calendar_app:matrix_calendar_test_password@localhost:5432/matrix_calendar_test
          MATRIX_CALENDAR_REMINDER_DATABASE_TLS_MODE: trusted-private-network
        run: yarn workspace @matrix-calendar-widget/server test:postgres-contract

      - name: Build server
        run: yarn workspace @matrix-calendar-widget/server build

      - name: Validate sidecar Compose defaults and opt-in configuration
        run: |
          node --test scripts/validate-sidecar-compose.test.mjs
          node scripts/validate-sidecar-compose.mjs \
            --project-name matrix-calendar-sidecar \
            --env-file deploy/etke-sidecar.env.example
          trap 'rm -f deploy/.env.server' EXIT
          cat > deploy/.env.server <<'EOF'
          ROOM_CALENDAR_BINDINGS='[{"roomId":"!pilot-room:example.org","calendarId":"team-calendar"}]'
          ROOM_CALENDAR_ACCESS_ENABLED=true
          ROOM_CALENDAR_EVENT_WRITES_ENABLED=true
          MATRIX_APPLICATION_SERVICE_USER_ID=@_matrix_calendar_service:example.org
          MATRIX_APPLICATION_SERVICE_TOKEN=synthetic-as-token
          MATRIX_CALENDAR_REMINDER_DATABASE_URL=postgresql://calendar:synthetic-secret@db.example.org:5432/calendar
          MATRIX_CALENDAR_REMINDER_CONFIGURATION_ENABLED=true
          ROOM_CALENDAR_REMINDER_DELIVERY_ENABLED=true
          ROOM_CALENDAR_ACTION_MESSAGES_ENABLED=true
          EOF
          node scripts/validate-sidecar-compose.mjs \
            --project-name matrix-calendar-sidecar \
            --env-file deploy/etke-sidecar.env.example
          cat > deploy/.env.server <<'EOF'
          ROOM_CALENDAR_EVENT_WRITES_ENABLED=true
          EOF
          if node scripts/validate-sidecar-compose.mjs \
            --project-name matrix-calendar-sidecar \
            --env-file deploy/etke-sidecar.env.example; then
            echo 'Expected an invalid room-write configuration to fail.' >&2
            exit 1
          fi

  container-images:
    name: Container image build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build calendar package
        run: yarn workspace @matrix-calendar-widget/calendar build

      - name: Build timezone data package
        run: yarn workspace @matrix-calendar-widget/ical-timezones build

      - name: Build server workspace
        run: yarn workspace @matrix-calendar-widget/server build

      - name: Build widget workspace
        run: yarn workspace @matrix-calendar-widget/widget build

      - name: Build server image (local only)
        run: docker build -t matrix-calendar-widget/server:ci -f matrix-calendar-server/Dockerfile .

      - name: Build widget image (local only)
        run: >-
          docker build --build-context root=.
          -t matrix-calendar-widget/widget:ci
          -f matrix-calendar-widget/Dockerfile
          matrix-calendar-widget

      - name: Test and build project-owned Radicale image (local only)
        run: |
          docker build --target test -t matrix-calendar-widget/radicale-openid:test -f radicale-auth/Dockerfile radicale-auth
          docker build --target runtime -t matrix-calendar-widget/radicale-openid:ci -f radicale-auth/Dockerfile radicale-auth

  calendar-browser-layout:
    name: Calendar browser layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build calendar prerequisites
        run: |
          yarn workspace @matrix-calendar-widget/ical-timezones build
          yarn workspace @matrix-calendar-widget/calendar build
      - name: Type check the synthetic calendar fixture
        run: |
          yarn exec -- tsc -p matrix-calendar-widget/browser-tests/tsconfig.json --noEmit
          yarn exec -- tsc -p e2e/calendar-tests/tsconfig.json --noEmit
      - name: Install Chromium
        run: yarn workspace e2e playwright install --with-deps chromium --only-shell
      - name: Measure calendar component layouts and accessibility
        run: yarn workspace e2e playwright test --config playwright.calendar.config.ts
      - name: Retain synthetic browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: calendar-browser-layout
          path: e2e/calendar-test-results
          if-no-files-found: ignore
          retention-days: 7
