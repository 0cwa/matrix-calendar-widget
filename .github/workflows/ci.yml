name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn prettier:check

      - name: Check fork identity
        run: bash scripts/check-fork-identity.sh

      - name: Validate local integration stack
        run: |
          bash -n dev/up.sh
          docker compose -f dev/compose.yaml config >/dev/null

      - name: Check dependencies
        run: yarn depcheck

      - name: Type check
        run: yarn tsc

  widget:
    name: Widget
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint calendar package
        run: yarn workspace @matrix-calendar-widget/calendar lint

      - name: Test calendar package
        run: yarn workspace @matrix-calendar-widget/calendar test:all

      - name: Build calendar package
        run: yarn workspace @matrix-calendar-widget/calendar build

      - name: Lint widget
        run: yarn workspace @matrix-calendar-widget/widget lint

      - name: Check widget translations
        run: yarn workspace @matrix-calendar-widget/widget translate --ci --dry-run

      - name: Test widget
        run: yarn workspace @matrix-calendar-widget/widget test:all

      - name: Build widget
        run: yarn workspace @matrix-calendar-widget/widget build

  server:
    name: Server and bot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_DB: matrix_calendar_test
          POSTGRES_USER: reminder_test
          POSTGRES_PASSWORD: reminder_test
        options: >-
          --health-cmd "pg_isready -U reminder_test -d matrix_calendar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint server
        run: yarn workspace @matrix-calendar-widget/server lint

      - name: Check server translations
        run: yarn workspace @matrix-calendar-widget/server translate --ci --dry-run

      - name: Test server
        run: yarn workspace @matrix-calendar-widget/server test:all

      - name: Test PostgreSQL reminder store
        env:
          MATRIX_CALENDAR_REMINDER_DATABASE_URL: postgresql://reminder_test:reminder_test@localhost:5432/matrix_calendar_test
        run: yarn workspace @matrix-calendar-widget/server test:postgres-contract

      - name: Build server
        run: yarn workspace @matrix-calendar-widget/server build

  container-images:
    name: Container image build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build calendar package
        run: yarn workspace @matrix-calendar-widget/calendar build

      - name: Build server workspace
        run: yarn workspace @matrix-calendar-widget/server build

      - name: Build widget workspace
        run: yarn workspace @matrix-calendar-widget/widget build

      - name: Build server image (local only)
        run: docker build -t 0cwa/matrix-calendar-server:ci -f matrix-calendar-server/Dockerfile .

      - name: Build widget image (local only)
        run: >-
          docker build --build-context root=.
          -t 0cwa/matrix-calendar-widget:ci
          -f matrix-calendar-widget/Dockerfile
          matrix-calendar-widget
