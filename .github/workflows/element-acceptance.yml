name: Element Web acceptance

on:
  workflow_dispatch:
    inputs:
      private_ui:
        description: Run the opt-in private calendar app UI and CalDAV lifecycle.
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: element-acceptance-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  element-web-acceptance:
    name: Element Web acceptance
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.private_ui }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MATRIX_CALENDAR_DEV_USER: calendar
      MATRIX_APPLICATION_SERVICE_TOKEN: matrix-calendar-contract-as-token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Run Element acceptance fixture suite
        uses: ./.github/actions/element-acceptance
        with:
          principal-mode: appservice
          private-ui: 'false'

  normal-bot-account-acceptance:
    name: Normal bot account acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MATRIX_CALENDAR_DEV_USER: calendar
      MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION: disabled
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Run Element acceptance fixture suite with a normal bot account
        uses: ./.github/actions/element-acceptance
        with:
          principal-mode: bot-account
          private-ui: ${{ github.event_name == 'workflow_dispatch' && inputs.private_ui && 'true' || 'false' }}
