name: Element Web acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/element-acceptance/action.yml'
      - '.github/workflows/element-acceptance.yml'
      - 'dev/**'
      - 'e2e/**'
      - 'matrix-calendar-server/**'
      - 'matrix-calendar-widget/**'
      - 'packages/calendar/**'
      - 'packages/ical-timezones/**'
      - 'package.json'
      - 'yarn.lock'
      - 'docs/PLAN.md'
      - 'docs/STATUS.md'

permissions:
  contents: read

concurrency:
  group: element-acceptance-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  element-web-acceptance:
    name: Element Web acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MATRIX_CALENDAR_DEV_USER: calendar
      MATRIX_APPLICATION_SERVICE_TOKEN: matrix-calendar-contract-as-token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Run Element acceptance fixture suite
        uses: ./.github/actions/element-acceptance
        with:
          principal-mode: appservice

  normal-bot-account-acceptance:
    name: Normal bot account acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MATRIX_CALENDAR_DEV_USER: calendar
      MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION: disabled
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Run Element acceptance fixture suite with a normal bot account
        uses: ./.github/actions/element-acceptance
        with:
          principal-mode: bot-account
