name: Element Desktop startup acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/element-desktop-startup.yml'
      - 'dev/element-desktop-*'
      - 'e2e/package.json'
      - 'yarn.lock'

permissions:
  contents: read

jobs:
  element-desktop-startup:
    name: Element Desktop startup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ELEMENT_DESKTOP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install locked workspace dependencies
        run: yarn install --frozen-lockfile

      - name: Test Desktop startup, egress policy, and evidence sanitizer
        run: |
          node --check dev/element-desktop-egress-policy.mjs
          node --check dev/element-desktop-startup.mjs
          node --check dev/element-desktop-evidence.mjs
          node dev/element-desktop-startup.test.mjs
          node dev/element-desktop-egress-policy.test.mjs
          node dev/element-desktop-evidence.test.mjs

      - name: Initialize private stage file
        run: |
          umask 077
          stage_file="$RUNNER_TEMP/element-desktop-startup-stage.jsonl"
          node_binary="$(command -v node)"
          : > "$stage_file"
          chmod 0600 "$stage_file"
          printf 'ELEMENT_DESKTOP_STAGE_FILE=%s\n' "$stage_file" >> "$GITHUB_ENV"
          printf 'ELEMENT_DESKTOP_NODE_BIN=%s\n' "$node_binary" >> "$GITHUB_ENV"

      - name: Create isolated Desktop identity and private profile
        run: |
          set -euo pipefail
          username=mcwdesktopprobe
          if getent passwd "$username" >/dev/null; then
            echo 'The isolated Desktop account name is already present.' >&2
            exit 1
          fi
          uid=24000
          while getent passwd "$uid" >/dev/null; do
            uid=$((uid + 1))
            if [[ "$uid" -gt 65535 ]]; then
              echo 'No isolated Desktop UID is available.' >&2
              exit 1
            fi
          done
          nogroup_gid="$(getent group nogroup | cut -d: -f3)"
          test -n "$nogroup_gid"
          {
            printf 'ELEMENT_DESKTOP_PROBE_UID=%s\n' "$uid"
            printf 'ELEMENT_DESKTOP_PROBE_USERNAME=%s\n' "$username"
          } >> "$GITHUB_ENV"
          sudo useradd --uid "$uid" --gid "$nogroup_gid" --no-create-home --shell /usr/sbin/nologin "$username"
          profile_root="$(mktemp -d "/tmp/mcw-element-desktop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXX")"
          printf 'ELEMENT_DESKTOP_PROFILE_ROOT=%s\n' "$profile_root" >> "$GITHUB_ENV"
          printf 'element-desktop-startup-profile-v1\n' > "$profile_root/.owned"
          chmod 0600 "$profile_root/.owned"
          sudo chown "$uid:$nogroup_gid" "$profile_root"
          sudo chown "$uid:$nogroup_gid" "$profile_root/.owned"
          sudo chmod 0700 "$profile_root"
          for child in home config data cache runtime profile probe; do
            sudo install -d -m 0700 -o "$uid" -g "$nogroup_gid" "$profile_root/$child"
          done
          probe_root="$profile_root/probe"
          sudo install -d -m 0700 -o "$uid" -g "$nogroup_gid" \
            "$probe_root/dev" "$probe_root/e2e" \
            "$probe_root/node_modules/@playwright/test"
          sudo install -d -m 0700 -o "$uid" -g "$nogroup_gid" \
            "$probe_root/node_modules/playwright" \
            "$probe_root/node_modules/playwright-core"
          sudo install -o "$uid" -g "$nogroup_gid" -m 0400 \
            "$GITHUB_WORKSPACE/dev/element-desktop-egress-policy.mjs" \
            "$probe_root/dev/element-desktop-egress-policy.mjs"
          sudo install -o "$uid" -g "$nogroup_gid" -m 0400 \
            "$GITHUB_WORKSPACE/dev/element-desktop-startup.mjs" \
            "$probe_root/dev/element-desktop-startup.mjs"
          sudo install -o "$uid" -g "$nogroup_gid" -m 0400 \
            "$GITHUB_WORKSPACE/dev/element-desktop-probe-config.json" \
            "$probe_root/dev/element-desktop-probe-config.json"
          sudo install -o "$uid" -g "$nogroup_gid" -m 0400 \
            "$GITHUB_WORKSPACE/e2e/package.json" "$probe_root/e2e/package.json"
          for package in @playwright/test playwright playwright-core; do
            source="$GITHUB_WORKSPACE/node_modules/$package"
            target="$probe_root/node_modules/$package"
            test -d "$source"
            sudo cp -aL "$source/." "$target/"
            sudo chown -R "$uid:$nogroup_gid" "$target"
            sudo chmod -R go-rwx "$target"
          done
          for source in \
            dev/element-desktop-egress-policy.mjs \
            dev/element-desktop-startup.mjs \
            dev/element-desktop-probe-config.json \
            e2e/package.json; do
            sudo cmp -s "$GITHUB_WORKSPACE/$source" "$probe_root/$source"
          done
          cdp_port="$(node --input-type=module -e '
            import { createServer } from "node:net";
            const server = createServer();
            server.listen({ host: "127.0.0.1", port: 0 }, () => {
              const address = server.address();
              if (!address || typeof address === "string") process.exit(2);
              process.stdout.write(String(address.port));
              server.close();
            });
          ')"
          test "$cdp_port" -ge 1024
          test "$cdp_port" -le 65535
          {
            printf 'ELEMENT_DESKTOP_CDP_PORT=%s\n' "$cdp_port"
            printf 'ELEMENT_DESKTOP_PROFILE_HOME=%s/home\n' "$profile_root"
            printf 'ELEMENT_DESKTOP_PROFILE_CONFIG=%s/config\n' "$profile_root"
            printf 'ELEMENT_DESKTOP_PROFILE_DATA=%s/data\n' "$profile_root"
            printf 'ELEMENT_DESKTOP_PROFILE_CACHE=%s/cache\n' "$profile_root"
            printf 'ELEMENT_DESKTOP_PROFILE_RUNTIME=%s/runtime\n' "$profile_root"
            printf 'ELEMENT_DESKTOP_EGRESS_SCRIPT_PATH=%s/dev/element-desktop-egress-policy.mjs\n' "$probe_root"
            printf 'ELEMENT_DESKTOP_STARTUP_SCRIPT_PATH=%s/dev/element-desktop-startup.mjs\n' "$probe_root"
            printf 'ELEMENT_DESKTOP_CONFIG_PATH=%s/dev/element-desktop-probe-config.json\n' "$probe_root"
          } >> "$GITHUB_ENV"

      - name: Preflight isolated Node and probe script before package installation
        run: |
          set +e
          preflight_output="$(sudo -n env \
            ELEMENT_DESKTOP_PROFILE_ROOT="$ELEMENT_DESKTOP_PROFILE_ROOT" \
            ELEMENT_DESKTOP_STARTUP_SCRIPT_PATH="$ELEMENT_DESKTOP_STARTUP_SCRIPT_PATH" \
            ELEMENT_DESKTOP_CONFIG_PATH="$ELEMENT_DESKTOP_CONFIG_PATH" \
            "$ELEMENT_DESKTOP_NODE_BIN" \
            dev/element-desktop-egress-policy.mjs target-uid-preflight \
            "$ELEMENT_DESKTOP_PROBE_UID" "$ELEMENT_DESKTOP_EGRESS_SCRIPT_PATH" 2>/dev/null)"
          preflight_exit=$?
          set -e
          if [[ -n "$preflight_output" ]]; then
            printf '%s\n' "$preflight_output" >> "$ELEMENT_DESKTOP_STAGE_FILE"
          else
            printf '%s\n' '{"phase":"target-uid-preflight","status":"failed","runtimeFacts":null,"scriptProbe":null}' \
              >> "$ELEMENT_DESKTOP_STAGE_FILE"
          fi
          if [[ "$preflight_exit" -ne 0 ]]; then
            echo 'The isolated UID Node and probe-script preflight failed.' >&2
            exit 1
          fi

      - name: Install authenticated Element Desktop package and probe tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/element-io-archive-keyring.gpg"
          source_file=/etc/apt/sources.list.d/element-desktop-startup.list
          system_key=/usr/share/keyrings/element-desktop-startup.gpg
          curl --fail --silent --show-error --location \
            https://packages.element.io/debian/element-io-archive-keyring.gpg \
            --output "$key_file"
          sudo install -D -m 0644 "$key_file" "$system_key"
          printf 'deb [arch=amd64 signed-by=%s] https://packages.element.io/debian/ default main\n' \
            "$system_key" | sudo tee "$source_file" >/dev/null
          sudo apt-get update --quiet
          package_metadata="$(apt-cache show element-desktop=1.12.30)"
          package_hash="$(printf '%s\n' "$package_metadata" | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const matches = input.split(/\n\n+/u).filter((block) => {
              const fields = Object.fromEntries(block.split(/\n/u).map((line) => {
                const split = line.indexOf(":");
                return split < 0 ? ["", ""] : [line.slice(0, split), line.slice(split + 1).trim()];
              }));
              return fields.Package === "element-desktop" && fields.Version === "1.12.30" && fields.Architecture === "amd64";
            });
            const values = matches.map((block) => /^SHA256:\s+([0-9a-f]{64})$/mu.exec(block)?.[1] ?? "");
            if (values.length !== 1 || !/^[0-9a-f]{64}$/u.test(values[0])) process.exit(2);
            process.stdout.write(values[0]);
          ')"
          cd "$RUNNER_TEMP"
          apt-get download element-desktop=1.12.30 >/dev/null 2>&1
          deb_file="$RUNNER_TEMP/element-desktop_1.12.30_amd64.deb"
          test -f "$deb_file"
          downloaded_hash="$(sha256sum "$deb_file" | cut -d ' ' -f 1)"
          test "$downloaded_hash" = "$package_hash"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            xvfb xauth dbus-daemon gnome-keyring libsecret-tools iptables iproute2 \
            element-desktop:amd64=1.12.30
          installed="$(dpkg-query -W -f='${Version}\t${Architecture}' element-desktop)"
          test "$installed" = $'1.12.30\tamd64'
          printf 'ELEMENT_DESKTOP_PACKAGE_SHA256=%s\n' "$package_hash" >> "$GITHUB_ENV"

      - name: Install exact dual-stack egress policy and deny-test it
        run: |
          set +e
          policy_status=failed
          negative_status=not_run
          negative_diagnostic=null
          sudo -n "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-egress-policy.mjs install \
            "$ELEMENT_DESKTOP_PROBE_UID" "$GITHUB_RUN_ID" "$ELEMENT_DESKTOP_CDP_PORT" \
            >/dev/null 2>&1
          install_status=$?
          if [[ "$install_status" -eq 0 ]]; then
            policy_status=passed
            probe_output="$(sudo -n env \
              ELEMENT_DESKTOP_PROFILE_ROOT="$ELEMENT_DESKTOP_PROFILE_ROOT" \
              "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-egress-policy.mjs negative-self-test \
              "$ELEMENT_DESKTOP_PROBE_UID" "$GITHUB_RUN_ID" "$ELEMENT_DESKTOP_CDP_PORT" "$ELEMENT_DESKTOP_EGRESS_SCRIPT_PATH" \
              2>/dev/null)"
            negative_exit=$?
            if [[ -n "$probe_output" ]]; then negative_diagnostic="$probe_output"; fi
            if [[ "$negative_exit" -eq 0 ]]; then
              negative_status=passed
              sudo -n "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-egress-policy.mjs zero-counters "$GITHUB_RUN_ID" \
                >/dev/null 2>&1
              reset_exit=$?
              if [[ "$reset_exit" -ne 0 ]]; then policy_status=failed; fi
            else
              negative_status=failed
              policy_status=failed
            fi
          fi
          printf '{"phase":"egress-policy","status":"%s","negativeTest":"%s","diagnostic":%s}\n' \
            "$policy_status" "$negative_status" "$negative_diagnostic" >> "$ELEMENT_DESKTOP_STAGE_FILE"
          if [[ "$policy_status" != passed || "$negative_status" != passed ]]; then
            echo 'The isolated dual-stack egress policy or its local deny test failed.' >&2
            exit 1
          fi

      - name: Start packaged Desktop under isolated identity
        run: |
          set +e
          result_file="$RUNNER_TEMP/element-desktop-startup-result.jsonl"
          before_app_counter='{"state":"not_observed","ipv4Blocked":null,"ipv6Blocked":null,"ipv4Classes":null,"ipv6Classes":null,"overflow":null}'
          after_app_spawn_counter='{"state":"not_observed","ipv4Blocked":null,"ipv6Blocked":null,"ipv4Classes":null,"ipv6Classes":null,"overflow":null}'
          after_page_load_counter='{"state":"not_observed","ipv4Blocked":null,"ipv6Blocked":null,"ipv4Classes":null,"ipv6Classes":null,"overflow":null}'
          before_app_uid_startup_observation=not_observed
          after_app_spawn_uid_startup_observation=not_observed
          after_page_load_uid_startup_observation=not_observed
          before_app_seen=false
          after_app_spawn_seen=false
          after_page_load_seen=false
          uid="$ELEMENT_DESKTOP_PROBE_UID"
          cdp_port="$ELEMENT_DESKTOP_CDP_PORT"
          # Each live phase ACK is capped at 13s including kill grace: counters and parse 4s,
          # PID/handoff parse 2s, UID snapshot 5s, and marker touch 2s. The app waits 15s.
          capture_egress_counters() {
            local counters
            if counters="$(timeout --kill-after=1s 1s sudo -n "$ELEMENT_DESKTOP_NODE_BIN" \
              dev/element-desktop-egress-policy.mjs counters "$GITHUB_RUN_ID" 2>/dev/null)"; then
              printf '%s' "$counters" | timeout --kill-after=1s 1s node --input-type=module -e '
                import { sanitizeEgressCounterObservation } from "./dev/element-desktop-evidence.mjs";
                let input=""; for await (const chunk of process.stdin) input+=chunk;
                process.stdout.write(JSON.stringify(sanitizeEgressCounterObservation(input)));
              '
            else
              printf '%s' '{"state":"unavailable","ipv4Blocked":null,"ipv6Blocked":null,"ipv4Classes":null,"ipv6Classes":null,"overflow":null}'
            fi
          }
          capture_uid_startup_observation() {
            local app_pid="${1:-}"
            local cdp_handoff="${2:-}"
            local observation
            if [[ ! "$uid" =~ ^[0-9]{1,5}$ ]] || [[ ! "$cdp_port" =~ ^[0-9]{1,5}$ ]]; then
              printf '%s' unavailable
              return
            fi
            if [[ -n "$app_pid" && -n "$cdp_handoff" ]]; then
              if [[ ! "$app_pid" =~ ^[1-9][0-9]{0,9}$ ]] || [[ "$app_pid" -gt 2147483647 ]]; then
                printf '%s' unavailable
                return
              fi
              observation="$(printf '%s' "$cdp_handoff" | timeout --signal=TERM --kill-after=1s 4s sudo -n \
                "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-startup.mjs \
                uid-startup-observation "$uid" "$cdp_port" "$app_pid" --cdp-renderer-handoff 2>/dev/null)"
            elif [[ -n "$app_pid" ]]; then
              if [[ ! "$app_pid" =~ ^[1-9][0-9]{0,9}$ ]] || [[ "$app_pid" -gt 2147483647 ]]; then
                printf '%s' unavailable
                return
              fi
              observation="$(timeout --signal=TERM --kill-after=1s 4s sudo -n \
                "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-startup.mjs \
                uid-startup-observation "$uid" "$cdp_port" "$app_pid" 2>/dev/null)"
            else
              observation="$(timeout --signal=TERM --kill-after=1s 4s sudo -n \
                "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-startup.mjs \
                uid-startup-observation "$uid" "$cdp_port" 2>/dev/null)"
            fi
            if [[ -z "$observation" ]]; then
              printf '%s' unavailable
            else
              printf '%s' "$observation"
            fi
          }
          timeout --signal=TERM --kill-after=5s 120s \
          sudo -n -u "$ELEMENT_DESKTOP_PROBE_USERNAME" -- /usr/bin/env \
            PATH="$PATH" \
            HOME="$ELEMENT_DESKTOP_PROFILE_HOME" \
            XDG_CONFIG_HOME="$ELEMENT_DESKTOP_PROFILE_CONFIG" \
            XDG_DATA_HOME="$ELEMENT_DESKTOP_PROFILE_DATA" \
            XDG_CACHE_HOME="$ELEMENT_DESKTOP_PROFILE_CACHE" \
            XDG_RUNTIME_DIR="$ELEMENT_DESKTOP_PROFILE_RUNTIME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            ELEMENT_DESKTOP_SOURCE_SHA="$ELEMENT_DESKTOP_SOURCE_SHA" \
            ELEMENT_DESKTOP_PACKAGE_SHA256="$ELEMENT_DESKTOP_PACKAGE_SHA256" \
            ELEMENT_DESKTOP_PROFILE_ROOT="$ELEMENT_DESKTOP_PROFILE_ROOT" \
            ELEMENT_DESKTOP_CONFIG_PATH="$ELEMENT_DESKTOP_CONFIG_PATH" \
            ELEMENT_DESKTOP_CDP_PORT="$ELEMENT_DESKTOP_CDP_PORT" \
            ELEMENT_DESKTOP_PROBE_UID="$ELEMENT_DESKTOP_PROBE_UID" \
            ELEMENT_DESKTOP_NO_UPDATE=true \
            dbus-run-session -- xvfb-run -a "$ELEMENT_DESKTOP_NODE_BIN" "$ELEMENT_DESKTOP_STARTUP_SCRIPT_PATH" \
            > "$result_file" 2>/dev/null &
          probe_pid=$!
          for ((attempt = 0; attempt < 1200; attempt++)); do
            if ! kill -0 "$probe_pid" 2>/dev/null; then break; fi
            if [[ "$before_app_seen" != true ]] && \
              grep -Fqx '{"phase":"desktop-startup-progress","milestone":"before-app"}' "$result_file" 2>/dev/null; then
              before_app_counter="$(capture_egress_counters)"
              before_app_uid_startup_observation="$(capture_uid_startup_observation)"
              timeout --kill-after=1s 1s sudo -n -u "$ELEMENT_DESKTOP_PROBE_USERNAME" -- touch \
                "$ELEMENT_DESKTOP_PROFILE_ROOT/.before-app-counter-read" >/dev/null 2>&1
              before_app_seen=true
            fi
            if [[ "$after_app_spawn_seen" != true ]] && \
              grep -Fq '{"phase":"desktop-startup-progress","milestone":"after-app-spawn","appPid":' "$result_file" 2>/dev/null; then
              after_app_spawn_counter="$(capture_egress_counters)"
              app_pid="$(timeout --signal=TERM --kill-after=1s 1s node --input-type=module - "$result_file" 2>/dev/null <<'NODE'
          import { readFileSync } from 'node:fs';
          const [resultFile] = process.argv.slice(2);
          for (const row of readFileSync(resultFile, 'utf8').split(/\r?\n/u).filter(Boolean)) {
            let value;
            try { value = JSON.parse(row); } catch { continue; }
            if (value.phase !== 'desktop-startup-progress' || value.milestone !== 'after-app-spawn') continue;
            if (Object.keys(value).sort().join(',') !== 'appPid,milestone,phase' || !Number.isSafeInteger(value.appPid) || value.appPid < 2 || value.appPid > 2147483647) process.exit(2);
            process.stdout.write(String(value.appPid));
            process.exit(0);
          }
          process.exit(1);
          NODE
              )"
              if [[ "$app_pid" =~ ^[1-9][0-9]{0,9}$ ]] && [[ "$app_pid" -ge 2 ]] && [[ "$app_pid" -le 2147483647 ]]; then
                after_app_spawn_uid_startup_observation="$(capture_uid_startup_observation "$app_pid")"
              else
                after_app_spawn_uid_startup_observation=unavailable
              fi
              timeout --kill-after=1s 1s sudo -n -u "$ELEMENT_DESKTOP_PROBE_USERNAME" -- touch \
                "$ELEMENT_DESKTOP_PROFILE_ROOT/.after-app-spawn-counter-read" >/dev/null 2>&1
              after_app_spawn_seen=true
            fi
            if [[ "$after_page_load_seen" != true ]] && \
              grep -Fq '{"phase":"desktop-startup-progress","milestone":"after-page-load","appPid":' "$result_file" 2>/dev/null; then
              after_page_load_counter="$(capture_egress_counters)"
              handoff_record="$(timeout --signal=TERM --kill-after=1s 1s node --input-type=module - "$result_file" 2>/dev/null <<'NODE'
          import { readFileSync } from 'node:fs';
          const [resultFile] = process.argv.slice(2);
          const validHandoff = (value) => {
            if (!value || typeof value !== 'object' || Array.isArray(value) || Object.keys(value).sort().join(',') !== 'overflow,pids,rendererCount,state') return false;
            if (!['unavailable','partial','observed'].includes(value.state)) return false;
            if (value.state === 'unavailable') return value.overflow === null && value.pids === null && value.rendererCount === null;
            return typeof value.overflow === 'boolean' && Number.isSafeInteger(value.rendererCount) && value.rendererCount >= 0 && value.rendererCount <= 64 && Array.isArray(value.pids) && value.pids.length === value.rendererCount && value.pids.every((pid,index)=>Number.isSafeInteger(pid)&&pid>=2&&pid<=2147483647&&value.pids.indexOf(pid)===index) && (value.state !== 'observed' || value.overflow === false);
          };
          for (const row of readFileSync(resultFile, 'utf8').split(/\r?\n/u).filter(Boolean)) {
            let value;
            try { value = JSON.parse(row); } catch { continue; }
            if (value.phase !== 'desktop-startup-progress' || value.milestone !== 'after-page-load') continue;
            if (Object.keys(value).sort().join(',') !== 'appPid,cdpRendererHandoff,milestone,phase' || !Number.isSafeInteger(value.appPid) || value.appPid < 2 || value.appPid > 2147483647 || !validHandoff(value.cdpRendererHandoff)) process.exit(2);
            process.stdout.write(`${value.appPid}\t${JSON.stringify(value.cdpRendererHandoff)}`);
            process.exit(0);
          }
          process.exit(1);
          NODE
              )"
              app_pid=''
              cdp_handoff=''
              IFS=$'\t' read -r app_pid cdp_handoff <<< "$handoff_record"
              if [[ "$app_pid" =~ ^[1-9][0-9]{0,9}$ ]] && [[ "$app_pid" -ge 2 ]] && [[ "$app_pid" -le 2147483647 ]] && [[ -n "$cdp_handoff" ]]; then
                after_page_load_uid_startup_observation="$(capture_uid_startup_observation "$app_pid" "$cdp_handoff")"
              else
                after_page_load_uid_startup_observation=unavailable
              fi
              timeout --kill-after=1s 1s sudo -n -u "$ELEMENT_DESKTOP_PROBE_USERNAME" -- touch \
                "$ELEMENT_DESKTOP_PROFILE_ROOT/.after-page-load-counter-read" >/dev/null 2>&1
              after_page_load_seen=true
            fi
            sleep 0.1
          done
          wait "$probe_pid"
          probe_exit=$?
          set -e
          if finalized_probe_status="$(ELEMENT_DESKTOP_BEFORE_APP_COUNTER="$before_app_counter" \
          ELEMENT_DESKTOP_AFTER_APP_SPAWN_COUNTER="$after_app_spawn_counter" \
          ELEMENT_DESKTOP_AFTER_PAGE_LOAD_COUNTER="$after_page_load_counter" \
          ELEMENT_DESKTOP_BEFORE_APP_UID_STARTUP_OBSERVATION="$before_app_uid_startup_observation" \
          ELEMENT_DESKTOP_AFTER_APP_SPAWN_UID_STARTUP_OBSERVATION="$after_app_spawn_uid_startup_observation" \
          ELEMENT_DESKTOP_AFTER_PAGE_LOAD_UID_STARTUP_OBSERVATION="$after_page_load_uid_startup_observation" \
          node --input-type=module - "$result_file" "$ELEMENT_DESKTOP_STAGE_FILE" "$probe_exit" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { acknowledgedEgressCounterObservation, emptyUidStartupObservation, resolveTrustedRendererSandbox, sanitizeEgressCounterObservation, sanitizeUidStartupObservation } from './dev/element-desktop-evidence.mjs';
          const [resultFile, stageFile, probeExitText] = process.argv.slice(2);
          const probeExit = Number(probeExitText);
          function startupObservation(raw) {
            return raw === 'not_observed'
              ? emptyUidStartupObservation('not_observed')
              : raw === 'unavailable'
                ? emptyUidStartupObservation('unavailable')
                : sanitizeUidStartupObservation(raw);
          }
          const beforeAppStartupObservation = startupObservation(
            process.env.ELEMENT_DESKTOP_BEFORE_APP_UID_STARTUP_OBSERVATION,
          );
          const afterAppSpawnStartupObservation = startupObservation(
            process.env.ELEMENT_DESKTOP_AFTER_APP_SPAWN_UID_STARTUP_OBSERVATION,
          );
          const afterPageLoadStartupObservation = startupObservation(
            process.env.ELEMENT_DESKTOP_AFTER_PAGE_LOAD_UID_STARTUP_OBSERVATION,
          );
          const beforeApp = sanitizeEgressCounterObservation(process.env.ELEMENT_DESKTOP_BEFORE_APP_COUNTER);
          const afterAppSpawn = sanitizeEgressCounterObservation(process.env.ELEMENT_DESKTOP_AFTER_APP_SPAWN_COUNTER);
          const afterPageLoad = sanitizeEgressCounterObservation(process.env.ELEMENT_DESKTOP_AFTER_PAGE_LOAD_COUNTER);
          const milestones = new Set(['before-app','after-app-spawn','after-page-load']);
          let finalizedStatus = 'failed';
          for (const row of readFileSync(resultFile, 'utf8').split(/\r?\n/u).filter(Boolean)) {
            let value;
            try { value = JSON.parse(row); } catch { continue; }
            if (value.phase === 'desktop-startup-progress') {
              const beforeApp = Object.keys(value).sort().join(',') === 'milestone,phase' && value.milestone === 'before-app';
              const validPid = Number.isSafeInteger(value.appPid) && value.appPid >= 2 && value.appPid <= 2147483647;
              const afterAppSpawn = Object.keys(value).sort().join(',') === 'appPid,milestone,phase' && value.milestone === 'after-app-spawn' && validPid;
              const afterPageLoad = Object.keys(value).sort().join(',') === 'appPid,cdpRendererHandoff,milestone,phase' && value.milestone === 'after-page-load' && validPid && value.cdpRendererHandoff && typeof value.cdpRendererHandoff === 'object';
              if (!milestones.has(value.milestone) || !(beforeApp || afterAppSpawn || afterPageLoad)) process.exit(2);
              continue;
            }
            if (value.phase === 'desktop-startup') {
              const initialStatus = value.status;
              const initialFailureCode = value.failureCode;
              const initialNativeSandbox = value.checks?.nativeSandbox;
              value.uidLifecycleDiagnostics = {
                beforeApp:beforeAppStartupObservation.uidLifecycleObservation,
                afterAppSpawn:afterAppSpawnStartupObservation.uidLifecycleObservation,
                afterPageLoad:afterPageLoadStartupObservation.uidLifecycleObservation,
              };
              value.uidTcpSocketDiagnostics = {
                beforeApp:beforeAppStartupObservation.tcpSocketObservation,
                afterPageLoad:afterPageLoadStartupObservation.tcpSocketObservation,
              };
              const acknowledgements = value.egressPhaseCounters ?? {};
              value.egressPhaseCounters = {
                beforeApp:acknowledgedEgressCounterObservation(beforeApp, acknowledgements.beforeApp?.state),
                afterAppSpawn:acknowledgedEgressCounterObservation(afterAppSpawn, acknowledgements.afterAppSpawn?.state),
                afterPageLoad:acknowledgedEgressCounterObservation(afterPageLoad, acknowledgements.afterPageLoad?.state),
              };
              const rendererSandbox = resolveTrustedRendererSandbox(
                value.rendererDiagnostics,
                value.uidLifecycleDiagnostics.afterPageLoad,
              );
              value.rendererDiagnostics = rendererSandbox.rendererDiagnostics;
              value.rendererCount = rendererSandbox.rendererCount;
              value.checks.nativeSandbox = rendererSandbox.passed ? 'passed' : 'failed';
              const otherChecksPassed = Object.entries(value.checks).every(
                ([name, state]) => name === 'nativeSandbox' || state === 'passed',
              );
              const pendingNativeOnly =
                probeExit === 1 &&
                initialStatus === 'failed' &&
                initialFailureCode === null &&
                initialNativeSandbox === 'not_run' &&
                otherChecksPassed;
              const alreadyPassed =
                probeExit === 0 &&
                initialStatus === 'passed' &&
                initialNativeSandbox === 'passed';
              const finalizedPassed =
                initialFailureCode === null &&
                rendererSandbox.passed &&
                otherChecksPassed &&
                (pendingNativeOnly || alreadyPassed);
              if (finalizedPassed) {
                value.failureCode = null;
                value.status = 'passed';
              } else {
                if (value.failureCode === null) {
                  value.failureCode = rendererSandbox.passed
                    ? 'probe-internal-error'
                    : 'renderer-sandbox-unconfirmed';
                }
                value.status = 'failed';
              }
              finalizedStatus = value.status;
              appendFileSync(stageFile, JSON.stringify(value) + '\n');
            }
          }
          process.stdout.write(finalizedStatus);
          NODE
          )"; then
            if [[ "$finalized_probe_status" == passed ]]; then
            # The trusted root snapshot finalizes the provisional app-side sandbox check.
              probe_exit=0
            else
              probe_exit=1
            fi
          else
            probe_exit=1
          fi
          if [[ "$probe_exit" -ne 0 ]]; then
            echo 'Packaged Element Desktop did not complete its startup checks.' >&2
            exit 1
          fi

      - name: Stop isolated processes, measure egress, and remove private resources
        if: always()
        run: |
          set +e
          stage_file="$RUNNER_TEMP/element-desktop-startup-stage.jsonl"
          mkdir -p "$RUNNER_TEMP"
          touch "$stage_file"
          chmod 0600 "$stage_file"
          uid="$ELEMENT_DESKTOP_PROBE_UID"
          username=mcwdesktopprobe
          run_id="$GITHUB_RUN_ID"
          isolated_processes=not_run
          policy_status=not_run
          user_status=not_run
          account_state=not_observed
          userdel_status=not_run
          userdel_exit_status=null
          uid_lifecycle_observation=not_observed
          profile_status=not_run
          apt_source_status=not_run
          observation_status=failed

          if [[ "$uid" =~ ^[0-9]{1,5}$ ]] && [[ "$uid" -gt 0 ]]; then
            isolated_processes=passed
            if pgrep -u "$uid" >/dev/null 2>&1; then
              sudo -n pkill -TERM -u "$uid" >/dev/null 2>&1
              sleep 2
              sudo -n pkill -KILL -u "$uid" >/dev/null 2>&1
            fi
            if pgrep -u "$uid" >/dev/null 2>&1; then isolated_processes=failed; fi
          fi

          if [[ "$run_id" =~ ^[0-9]{1,18}$ ]] && [[ "$uid" =~ ^[0-9]{1,5}$ ]]; then
            counter_json="$(sudo -n "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-egress-policy.mjs counters "$run_id" 2>/dev/null)"
            if [[ -n "$counter_json" ]]; then
              observation="$(printf '%s' "$counter_json" | node --input-type=module -e '
                import { sanitizeEgressCounterObservation } from "./dev/element-desktop-evidence.mjs";
                let input=""; for await (const chunk of process.stdin) input+=chunk;
                const value=sanitizeEgressCounterObservation(input);
                const valid=["observed","partial"].includes(value.state);
                process.stdout.write(valid?JSON.stringify({phase:"egress-observation",status:"passed",ipv4Blocked:value.ipv4Blocked,ipv6Blocked:value.ipv6Blocked,ipv4Classes:value.ipv4Classes,ipv6Classes:value.ipv6Classes,overflow:value.overflow}):"");
              ')"
              if [[ -n "$observation" ]]; then
                printf '%s\n' "$observation" >> "$stage_file"
                observation_status=passed
              fi
            fi
          fi

          if [[ "$uid" =~ ^[0-9]{1,5}$ ]] && [[ "$uid" -gt 0 ]] && \
            [[ -n "$ELEMENT_DESKTOP_STARTUP_SCRIPT_PATH" ]]; then
            process_observation="$(timeout --signal=TERM --kill-after=1s 6s sudo -n "$ELEMENT_DESKTOP_NODE_BIN" \
              "$GITHUB_WORKSPACE/dev/element-desktop-startup.mjs" uid-lifecycle-observation "$uid" 2>/dev/null)"
            if [[ -n "$process_observation" ]]; then
              uid_lifecycle_observation="$process_observation"
            else
              uid_lifecycle_observation=unavailable
            fi
          fi
          if [[ "$observation_status" != passed ]]; then
            printf '%s\n' '{"phase":"egress-observation","status":"failed","ipv4Blocked":null,"ipv6Blocked":null,"ipv4Classes":null,"ipv6Classes":null,"overflow":null}' >> "$stage_file"
          fi

          if [[ "$uid" =~ ^[0-9]{1,5}$ ]] && [[ "$uid" -gt 0 ]] && [[ "$run_id" =~ ^[0-9]{1,18}$ ]]; then
            if sudo -n "$ELEMENT_DESKTOP_NODE_BIN" dev/element-desktop-egress-policy.mjs remove "$uid" "$run_id" >/dev/null 2>&1; then
              policy_status=passed
            else
              policy_status=failed
            fi
          fi

          if [[ "$uid" =~ ^[0-9]{1,5}$ ]] && [[ "$uid" -gt 0 ]]; then
            account_uid="$(getent passwd "$username" | cut -d: -f3)"
            if [[ -n "$account_uid" ]]; then
              if [[ "$account_uid" == "$uid" ]]; then
                if timeout --signal=TERM --kill-after=1s 10s sudo -n userdel \
                  "$username" >/dev/null 2>&1; then
                  user_status=passed
                  userdel_status=passed
                  userdel_exit_status=0
                else
                  userdel_exit_status=$?
                  user_status=failed
                  userdel_status=failed
                fi
              else
                user_status=failed
              fi
            else
              user_status=passed
            fi
            if getent passwd "$username" >/dev/null; then user_status=failed; fi

            account_record="$(getent passwd "$username" 2>/dev/null)"
            account_lookup=$?
            if [[ "$account_lookup" -eq 0 ]]; then
              account_uid="$(printf '%s' "$account_record" | cut -d: -f3)"
              if [[ "$account_uid" == "$uid" ]]; then
                account_state=uid_match
              else
                account_state=uid_mismatch
              fi
            elif [[ "$account_lookup" -eq 2 ]]; then
              account_state=absent
            else
              account_state=unavailable
            fi
          fi

          profile_root="$ELEMENT_DESKTOP_PROFILE_ROOT"
          if [[ -z "$profile_root" ]]; then
            profile_status=passed
          elif [[ "$profile_root" =~ ^/tmp/mcw-element-desktop-[0-9]{1,18}-[0-9]{1,6}-[A-Za-z0-9]{6}$ ]]; then
            if [[ ! -e "$profile_root" ]]; then
              profile_status=passed
            elif [[ -d "$profile_root" && ! -L "$profile_root" && ! -L "$profile_root/.owned" ]] && \
              { [[ "$(stat -c %u "$profile_root" 2>/dev/null)" == "$(id -u)" ]] || \
                [[ "$(stat -c %u "$profile_root" 2>/dev/null)" == "$uid" ]]; } && \
              { [[ ! -e "$profile_root/.owned" ]] || \
                [[ "$(sudo -n cat "$profile_root/.owned" 2>/dev/null)" == element-desktop-startup-profile-v1 ]]; }; then
              if sudo -n rm -rf -- "$profile_root" >/dev/null 2>&1 && [[ ! -e "$profile_root" ]]; then
                profile_status=passed
              else
                profile_status=failed
              fi
            else
              profile_status=failed
            fi
          else
            profile_status=failed
          fi

          if sudo -n rm -f \
            /etc/apt/sources.list.d/element-desktop-startup.list \
            /usr/share/keyrings/element-desktop-startup.gpg \
            "$RUNNER_TEMP/element-io-archive-keyring.gpg" \
            "$RUNNER_TEMP/element-desktop_1.12.30_amd64.deb" \
            "$RUNNER_TEMP/element-desktop-startup-result.jsonl"; then
            apt_source_status=passed
          else
            apt_source_status=failed
          fi
          if [[ -e /etc/apt/sources.list.d/element-desktop-startup.list || \
                -e /usr/share/keyrings/element-desktop-startup.gpg || \
                -e "$RUNNER_TEMP/element-io-archive-keyring.gpg" || \
                -e "$RUNNER_TEMP/element-desktop_1.12.30_amd64.deb" ]]; then
            apt_source_status=failed
          fi

          ELEMENT_DESKTOP_ISOLATED_PROCESSES="$isolated_processes" \
          ELEMENT_DESKTOP_POLICY_CLEANUP="$policy_status" \
          ELEMENT_DESKTOP_USER_CLEANUP="$user_status" \
          ELEMENT_DESKTOP_ACCOUNT_STATE="$account_state" \
          ELEMENT_DESKTOP_USERDEL_STATUS="$userdel_status" \
          ELEMENT_DESKTOP_USERDEL_EXIT_STATUS="$userdel_exit_status" \
          ELEMENT_DESKTOP_UID_LIFECYCLE_OBSERVATION="$uid_lifecycle_observation" \
          ELEMENT_DESKTOP_PROFILE_CLEANUP="$profile_status" \
          ELEMENT_DESKTOP_APT_CLEANUP="$apt_source_status" \
          node --input-type=module - "$stage_file" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { emptyUidLifecycleObservation, sanitizeUidLifecycleObservation, uidProcessObservationFromLifecycle } from './dev/element-desktop-evidence.mjs';
          const [stageFile] = process.argv.slice(2);
          const lifecycleRaw = process.env.ELEMENT_DESKTOP_UID_LIFECYCLE_OBSERVATION;
          const uidLifecycleObservation = lifecycleRaw === 'not_observed'
            ? emptyUidLifecycleObservation('not_observed')
            : lifecycleRaw === 'unavailable'
              ? emptyUidLifecycleObservation('unavailable')
              : sanitizeUidLifecycleObservation(lifecycleRaw);
          const exitStatusRaw = process.env.ELEMENT_DESKTOP_USERDEL_EXIT_STATUS;
          const userdelExitStatus = /^(?:0|[1-9][0-9]{0,2})$/u.test(exitStatusRaw ?? '') && Number(exitStatusRaw) <= 255
            ? Number(exitStatusRaw)
            : null;
          const rows = readFileSync(stageFile, 'utf8').split(/\r?\n/u).filter(Boolean);
          const phases = new Set();
          for (const row of rows) phases.add(JSON.parse(row).phase);
          if (!phases.has('target-uid-preflight')) {
            appendFileSync(stageFile, JSON.stringify({
              phase:'target-uid-preflight',status:'failed',runtimeFacts:null,scriptProbe:null,
            }) + '\n');
          }
          for (const phase of ['egress-policy','egress-observation']) {
            if (!phases.has(phase)) {
              const fallback = phase === 'egress-policy'
                ? {phase,status:'not_run',negativeTest:'not_run',diagnostic:null}
                : {phase,status:'failed',ipv4Blocked:null,ipv6Blocked:null,ipv4Classes:null,ipv6Classes:null,overflow:null};
              appendFileSync(stageFile, JSON.stringify(fallback) + '\n');
            }
          }
          appendFileSync(stageFile, JSON.stringify({
            phase:'cleanup',
            isolatedProcesses:process.env.ELEMENT_DESKTOP_ISOLATED_PROCESSES,
            policy:process.env.ELEMENT_DESKTOP_POLICY_CLEANUP,
            user:process.env.ELEMENT_DESKTOP_USER_CLEANUP,
            profile:process.env.ELEMENT_DESKTOP_PROFILE_CLEANUP,
            aptSource:process.env.ELEMENT_DESKTOP_APT_CLEANUP,
            accountState:['not_observed','unavailable','absent','uid_match','uid_mismatch'].includes(process.env.ELEMENT_DESKTOP_ACCOUNT_STATE)
              ? process.env.ELEMENT_DESKTOP_ACCOUNT_STATE : 'unavailable',
            userdelStatus:['passed','failed','not_run'].includes(process.env.ELEMENT_DESKTOP_USERDEL_STATUS)
              ? process.env.ELEMENT_DESKTOP_USERDEL_STATUS : 'not_run',
            userdelExitStatus,
            uidProcessObservation:uidProcessObservationFromLifecycle(uidLifecycleObservation),
            uidLifecycleObservation,
          }) + '\n');
          NODE

      - name: Sanitize Desktop startup evidence
        if: always()
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/element-desktop-startup-safe-summary.json"
          node dev/element-desktop-evidence.mjs \
            "$RUNNER_TEMP/element-desktop-startup-stage.jsonl" \
            "$ELEMENT_DESKTOP_SOURCE_SHA" > "$summary_file"
          node --input-type=module - "$summary_file" <<'NODE'
          import { readFileSync } from 'node:fs';
          const [path] = process.argv.slice(2);
          const summary = JSON.parse(readFileSync(path, 'utf8'));
          if (summary.status !== 'passed') process.exit(1);
          NODE
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized Desktop startup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: element-desktop-startup-summary
          path: ${{ runner.temp }}/element-desktop-startup-safe-summary.json
          if-no-files-found: ignore
          retention-days: 1
