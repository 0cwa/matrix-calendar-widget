name: Format M1 repository

on:
  push:
    branches:
      - feat/m1-calendar-repository
    paths:
      - .github/workflows/format-m1-repository.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: >
          yarn prettier --write
          packages/calendar/src/repository/index.ts
          packages/calendar/src/repository/inMemoryCalendarRepository.ts
          packages/calendar/src/repository/inMemoryCalendarRepository.test.ts
          packages/calendar/src/index.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/calendar/src/repository packages/calendar/src/index.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format calendar repository files"
          git push origin HEAD:feat/m1-calendar-repository
