name: Format presentation branch

on:
  push:
    branches:
      - feat/m1-calendar-presentation
    paths:
      - .github/workflows/format-presentation-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m1-calendar-presentation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Format presentation files
        run: >
          yarn prettier --write
          matrix-calendar-widget/src/App.test.tsx
          matrix-calendar-widget/src/calendar/calendarEventPresentation.test.ts
          matrix-calendar-widget/src/calendar/calendarEventPresentation.ts
          matrix-calendar-widget/src/calendar/index.ts
          matrix-calendar-widget/src/components/calendar/CalendarEventsCalendar.tsx
          matrix-calendar-widget/src/components/calendar/CalendarEventsList.test.tsx
          matrix-calendar-widget/src/components/meetings/MeetingsPanel/MeetingsPanel.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matrix-calendar-widget/src
          if git diff --cached --quiet; then
            exit 0
          fi
          HUSKY=0 git commit -m "style: format repository-backed calendar presentation"
          git push origin HEAD:feat/m1-calendar-presentation
