name: Temporary server focused test locations

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-server-test-locations.yml'
      - 'scripts/temporary-server-test-locations.mjs'

permissions:
  contents: read

jobs:
  focused-server-tests:
    name: Focused server tests (${{ matrix.candidate }})
    if: github.event.pull_request.head.repo.full_name == '0cwa/matrix-calendar-widget'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: temporary-server-test-locations-${{ github.event.pull_request.number || github.ref }}-${{ matrix.candidate }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: alarm-server
            sha: c64bf613fdc9048cded4ac1b8f7fc96c19a07314
          - candidate: attachment-server
            sha: f4ac59fcdd56979ac1b67822f275d47267bdebe7
          - candidate: attachment-widget
            sha: f4ac59fcdd56979ac1b67822f275d47267bdebe7
          - candidate: text-widget
            sha: fe1a9c63aae28350ef2dc01563b1f3bf8eb7f3fd
    steps:
      - name: Check out locator source
        uses: actions/checkout@v7
        with:
          repository: 0cwa/matrix-calendar-widget
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check out immutable candidate
        uses: actions/checkout@v7
        with:
          repository: 0cwa/matrix-calendar-widget
          ref: ${{ matrix.sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Node 22 and Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: candidate/yarn.lock

      - name: Run sanitizer self-tests
        run: |
          set -euo pipefail
          summary_path="$GITHUB_STEP_SUMMARY"
          log="$RUNNER_TEMP/locator-self-test.log"
          trap 'rm -f "$log"' EXIT
          unset GITHUB_STEP_SUMMARY GITHUB_OUTPUT GITHUB_ENV
          if ! node scripts/temporary-server-test-locations.mjs self-test >"$log" 2>&1; then
            printf '%s\n' 'diagnostic-unavailable code=sanitizer-self-test' >> "$summary_path"
            exit 1
          fi

      - name: Install, build linked packages, and run pinned test suites
        working-directory: candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          locator="$GITHUB_WORKSPACE/scripts/temporary-server-test-locations.mjs"
          summary_path="$GITHUB_STEP_SUMMARY"
          install_log="$RUNNER_TEMP/locator-yarn-install.log"
          timezone_log="$RUNNER_TEMP/locator-timezone-build.log"
          calendar_log="$RUNNER_TEMP/locator-calendar-build.log"
          test_log="$RUNNER_TEMP/locator-tests.log"
          report="$RUNNER_TEMP/locator-test-results.json"
          safe_summary="$RUNNER_TEMP/locator-safe-summary.txt"
          path_file="$RUNNER_TEMP/locator-approved-paths.txt"
          parser_log="$RUNNER_TEMP/locator-parser.log"
          trap 'rm -f "$install_log" "$timezone_log" "$calendar_log" "$test_log" "$report" "$safe_summary" "$path_file" "$parser_log"' EXIT

          # Test/build code must not write unsanitized output to GitHub command files.
          unset GITHUB_STEP_SUMMARY GITHUB_OUTPUT GITHUB_ENV

          case "$CANDIDATE" in
            alarm-server) approved_sha='c64bf613fdc9048cded4ac1b8f7fc96c19a07314' ;;
            attachment-server|attachment-widget) approved_sha='f4ac59fcdd56979ac1b67822f275d47267bdebe7' ;;
            text-widget) approved_sha='fe1a9c63aae28350ef2dc01563b1f3bf8eb7f3fd' ;;
            *) printf '%s\n' 'diagnostic-unavailable code=target-map' >> "$summary_path"; exit 1 ;;
          esac
          expected_sha="$EXPECTED_SHA"
          if [ "$expected_sha" != "$approved_sha" ]; then
            printf '%s\n' 'diagnostic-unavailable code=candidate-revision' >> "$summary_path"
            exit 1
          fi
          candidate_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          if [ "$candidate_sha" != "$expected_sha" ]; then
            printf '%s\n' 'diagnostic-unavailable code=candidate-revision' >> "$summary_path"
            exit 1
          fi

          case "$CANDIDATE" in
            alarm-server|attachment-server)
              test_paths=()
              ;;
            attachment-widget|text-widget)
              if ! node "$locator" paths "$CANDIDATE" >"$path_file" 2>"$parser_log"; then
                printf '%s\n' 'diagnostic-unavailable code=target-map' >> "$summary_path"
                exit 1
              fi
              mapfile -t test_paths < "$path_file"
              if [ "${#test_paths[@]}" -ne 2 ]; then
                printf '%s\n' 'diagnostic-unavailable code=target-map' >> "$summary_path"
                exit 1
              fi
              ;;
            *)
              printf '%s\n' 'diagnostic-unavailable code=target-map' >> "$summary_path"
              exit 1
              ;;
          esac

          if ! yarn install --frozen-lockfile >"$install_log" 2>&1; then
            printf '%s\n' 'diagnostic-unavailable code=install-failed' >> "$summary_path"
            exit 1
          fi
          if ! yarn workspace @matrix-calendar-widget/ical-timezones build >"$timezone_log" 2>&1; then
            printf '%s\n' 'diagnostic-unavailable code=timezone-build-failed' >> "$summary_path"
            exit 1
          fi
          if ! yarn workspace @matrix-calendar-widget/calendar build >"$calendar_log" 2>&1; then
            printf '%s\n' 'diagnostic-unavailable code=calendar-build-failed' >> "$summary_path"
            exit 1
          fi

          set +e
          case "$CANDIDATE" in
            alarm-server|attachment-server)
              yarn workspace @matrix-calendar-widget/server test:all \
                --runInBand \
                --json \
                --outputFile="$report" \
                --testLocationInResults
              ;;
            attachment-widget|text-widget)
              if [ "${#test_paths[@]}" -ne 2 ]; then
                printf '%s\n' 'diagnostic-unavailable code=target-map' >> "$summary_path"
                exit 1
              fi
              yarn workspace @matrix-calendar-widget/widget test:all \
                "${test_paths[@]}" \
                --includeTaskLocation \
                --reporter=json \
                --outputFile="$report"
              ;;
            *)
              printf '%s\n' 'diagnostic-unavailable code=target-map' >> "$summary_path"
              exit 1
              ;;
          esac >"$test_log" 2>&1
          test_status=$?
          set -e

          set +e
          node "$locator" summarize "$CANDIDATE" "$report" "$test_status" \
            >"$safe_summary" 2>"$parser_log"
          summary_status=$?
          set -e

          if [ -s "$safe_summary" ]; then
            cat "$safe_summary" >> "$summary_path"
            cat "$safe_summary"
          else
            printf '%s\n' 'diagnostic-unavailable code=report-shape' >> "$summary_path"
            printf '%s\n' 'diagnostic-unavailable code=report-shape'
            summary_status=1
          fi

          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"