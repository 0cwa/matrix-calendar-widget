name: Format semantic calendar tests

on:
  push:
    branches:
      - feat/m1-calendar-presentation
    paths:
      - .github/workflows/format-semantic-calendar-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m1-calendar-presentation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier --write matrix-calendar-widget/src/components/meetings/MeetingsPanel/MeetingsPanel.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matrix-calendar-widget/src/components/meetings/MeetingsPanel/MeetingsPanel.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          HUSKY=0 git commit -m "style: format semantic calendar tests"
          git push origin HEAD:feat/m1-calendar-presentation
