name: Refresh README gallery

# Only a manual run on main publishes to the README image branch.
# PRs touching the gallery run captures for review without publishing.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Select the gallery capture or a Thunderbird calendar qualification profile.
        required: true
        type: choice
        default: gallery
        options:
          - gallery
          - calendar-client-smoke
          - public-ics-feed-smoke
          - private-caldav-client-smoke
  pull_request:
    paths:
      - '.github/workflows/readme-gallery.yml'
      - 'e2e/gallery-tests/**'
      - 'e2e/playwright.gallery.config.ts'
      - 'matrix-calendar-widget/browser-tests/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: readme-gallery-${{ github.event_name }}-${{ github.ref }}-${{ inputs.profile || 'gallery' }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture gallery screenshots
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profile == 'gallery')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build calendar prerequisites
        run: |
          yarn workspace @matrix-calendar-widget/ical-timezones build
          yarn workspace @matrix-calendar-widget/calendar build

      - name: Type-check gallery fixtures
        run: |
          yarn exec -- tsc -p matrix-calendar-widget/browser-tests/tsconfig.json --noEmit
          yarn exec -- tsc -p e2e/gallery-tests/tsconfig.json --noEmit

      - name: Install Chromium
        run: yarn workspace e2e playwright install --with-deps chromium --only-shell

      - name: Capture and combine light/dark screenshots
        run: yarn workspace e2e playwright test --config playwright.gallery.config.ts

      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-gallery
          path: gallery-output/*.png
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish screenshot assets
    needs: screenshots
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profile == 'gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download screenshots from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-gallery
          path: gallery-output

      - name: Publish to the image-only gallery branch
        shell: bash
        run: |
          set -euo pipefail
          for name in month-desktop event-details mobile-list mobile-create; do
            test -s "gallery-output/${name}.png"
          done
          image_dir="$(mktemp -d)"
          cp gallery-output/*.png "$image_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin refs/heads/readme-gallery >/dev/null 2>&1; then
            git fetch --no-tags origin readme-gallery
            git switch -C readme-gallery FETCH_HEAD
          else
            git switch --orphan readme-gallery
            git rm -rfq --ignore-unmatch .
          fi
          mkdir -p images
          for name in month-desktop event-details mobile-list mobile-create; do
            cp "$image_dir/${name}.png" "images/${name}.png"
          done
          {
            echo '# README gallery'
            echo
            echo 'Screenshots rendered from the real calendar React components with'
            echo 'fictional demo events. No Matrix or CalDAV credentials are used.'
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo 'Dates and browser timezone are fixed to October 2026 / Europe/Stockholm.'
            echo 'Each screenshot combines matching light and dark themes: light upper-left, dark lower-right, separated diagonally from bottom-left to top-right.'
          } > SOURCE.md
          git add images SOURCE.md
          if git diff --cached --quiet; then
            echo 'Screenshots are unchanged.'
          else
            git commit -m "docs: refresh README gallery from ${GITHUB_SHA:0:12}"
            git push origin HEAD:refs/heads/readme-gallery
          fi

  calendar-client-smoke:
    name: Thunderbird Calendar-tab startup smoke (not CalDAV qualification)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'calendar-client-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TB_DOCKER_IMAGE: thunderbird-calendar-smoke:${{ github.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the pinned isolated Thunderbird runtime image
        id: tb_image
        run: |
          set -euo pipefail
          image_context="$RUNNER_TEMP/thunderbird-smoke-image-context"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "$runner_uid" =~ ^[0-9]+$ && "$runner_gid" =~ ^[0-9]+$ ]]
          [[ "$runner_uid" -gt 0 && "$runner_gid" -gt 0 ]]
          mkdir -m 0700 "$image_context"
          install -m 0600 dev/thunderbird-calendar-smoke.Dockerfile "$image_context/Dockerfile"
          docker build --platform linux/amd64 --pull \
            --build-arg "TASK_UID=$runner_uid" --build-arg "TASK_GID=$runner_gid" \
            --file "$image_context/Dockerfile" --tag "$TB_DOCKER_IMAGE" "$image_context"
          docker image inspect --format '{{.Id}}' "$TB_DOCKER_IMAGE" >/dev/null

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check closed Thunderbird startup diagnostics offline
        run: python -B dev/test_thunderbird_calendar_smoke.py

      - name: Check Docker smoke isolation before app download
        id: tb_preflight
        run: python -B dev/thunderbird-calendar-smoke.py preflight

      - name: Download and prepare pinned Thunderbird artifacts
        id: tb_prepare
        run: python -B dev/thunderbird-calendar-smoke.py prepare

      - name: Start Thunderbird headlessly and check the Calendar tab
        id: tb_smoke
        run: python -B dev/thunderbird-calendar-smoke.py smoke

      - name: Finalize closed smoke evidence
        if: always()
        env:
          TB_IMAGE_OUTCOME: ${{ steps.tb_image.outcome }}
          TB_PREFLIGHT_OUTCOME: ${{ steps.tb_preflight.outcome }}
          TB_PREPARE_OUTCOME: ${{ steps.tb_prepare.outcome }}
          TB_SMOKE_OUTCOME: ${{ steps.tb_smoke.outcome }}
        run: python3 -B dev/thunderbird-calendar-smoke.py finalize

      - name: Add the closed smoke summary to this run
        if: always()
        run: |
          summary="$RUNNER_TEMP/thunderbird-calendar-smoke-summary.json"
          if [[ ! -s "$summary" ]]; then
            printf '{"schema":"thunderbird-calendar-startup-smoke@6","qualification_scope":"startup_only_not_caldav","source_sha":"%s","status":"failed","phase":"complete","error_class":"internal_error","failed_artifact":null,"network_error_class":null,"http_status":null,"archive_sha256_verified":false,"archive_sha512_verified":false,"python_artifacts_verified":false,"docker_backend_verified":false,"docker_isolation_verified":false,"marionette_handshake":false,"main_window":false,"calendar_tab":false,"tabmail_present":false,"calendar_mode_registered":false,"calendar_tab_open_before_action":false,"calendar_tab_open_attempted":false,"calendar_tab_open_error":false,"app_version":null,"startup_stage":null,"startup_exception_class":null,"binary_version_probe":null,"binary_version":null,"binary_version_exit_code":null,"marionette_port_ready":false,"marionette_session_created":false,"child_state":"unknown","child_exit_code":null}\n' "$GITHUB_SHA" > "$summary"
            chmod 0600 "$summary"
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload closed smoke evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thunderbird-calendar-startup-summary
          path: ${{ runner.temp }}/thunderbird-calendar-smoke-summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload bounded startup-only version-probe diagnostic
        if: always() && steps.tb_smoke.outputs.startup_diagnostic_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thunderbird-startup-probe-diagnostic
          path: ${{ runner.temp }}/thunderbird-startup-probe-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 1

  private-caldav-client-smoke:
    name: Thunderbird private CalDAV client qualification
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'private-caldav-client-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TB_DOCKER_IMAGE: thunderbird-calendar-smoke:${{ github.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build the isolated Thunderbird and pinned Radicale runtime image
        id: tb_private_image
        run: |
          set -euo pipefail
          image_context="$RUNNER_TEMP/thunderbird-private-caldav-image-context"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "$runner_uid" =~ ^[0-9]+$ && "$runner_gid" =~ ^[0-9]+$ ]]
          [[ "$runner_uid" -gt 0 && "$runner_gid" -gt 0 ]]
          mkdir -m 0700 "$image_context"
          install -m 0600 dev/thunderbird-private-caldav.Dockerfile "$image_context/Dockerfile"
          docker build --platform linux/amd64 --pull \
            --build-context "radicale-auth=$GITHUB_WORKSPACE/radicale-auth" \
            --build-arg "TASK_UID=$runner_uid" --build-arg "TASK_GID=$runner_gid" \
            --file "$image_context/Dockerfile" --tag "$TB_DOCKER_IMAGE" "$image_context"
          docker image inspect --format '{{.Id}}' "$TB_DOCKER_IMAGE" >/dev/null

      - name: Check closed Thunderbird startup diagnostics offline
        run: python -B dev/test_thunderbird_calendar_smoke.py

      - name: Check the hash-locked private CalDAV dependencies offline
        run: python -B dev/test_thunderbird_private_caldav_dependencies.py

      - name: Check closed private CalDAV runner evidence offline
        run: python -B dev/test_thunderbird_private_caldav_smoke.py

      - name: Check Docker isolation before application download
        id: tb_private_preflight
        run: python -B dev/thunderbird-calendar-smoke.py preflight

      - name: Download and prepare pinned Thunderbird and Marionette artifacts
        id: tb_private_prepare
        run: python -B dev/thunderbird-calendar-smoke.py prepare

      - name: Prepare the hash-locked private CalDAV and Node runtimes
        id: tb_private_dependencies
        run: python -B dev/thunderbird-private-caldav-smoke.py prepare

      - name: Install private CalDAV dependencies offline in the task container
        id: tb_private_install
        run: python -B dev/thunderbird-private-caldav-smoke.py install

      - name: Run Thunderbird against the isolated private CalDAV fixture
        id: tb_private_run
        run: python -B dev/thunderbird-private-caldav-smoke.py run

      - name: Close private CalDAV qualification evidence
        if: always()
        env:
          TB_PRIVATE_IMAGE_OUTCOME: ${{ steps.tb_private_image.outcome }}
          TB_PRIVATE_PREFLIGHT_OUTCOME: ${{ steps.tb_private_preflight.outcome }}
          TB_PRIVATE_PREPARE_OUTCOME: ${{ steps.tb_private_prepare.outcome }}
          TB_PRIVATE_INSTALL_OUTCOME: ${{ steps.tb_private_install.outcome }}
          TB_PRIVATE_RUN_OUTCOME: ${{ steps.tb_private_run.outcome }}
        run: python3 -B dev/thunderbird-private-caldav-smoke.py finalize

      - name: Add the closed private CalDAV summary to this run
        if: always()
        run: cat "$RUNNER_TEMP/thunderbird-private-caldav-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload closed private CalDAV evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thunderbird-private-caldav-summary
          path: ${{ runner.temp }}/thunderbird-private-caldav-summary.json
          if-no-files-found: error
          retention-days: 1

  public-ics-feed-smoke:
    name: Thunderbird public ICS feed qualification
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'public-ics-feed-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TB_DOCKER_IMAGE: thunderbird-calendar-smoke:${{ github.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install workspace dependencies
        id: tb_public_workspace
        run: yarn install --frozen-lockfile

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build the isolated Thunderbird and pinned Radicale runtime image
        id: tb_public_image
        run: |
          set -euo pipefail
          image_context="$RUNNER_TEMP/thunderbird-public-feed-image-context"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "$runner_uid" =~ ^[0-9]+$ && "$runner_gid" =~ ^[0-9]+$ ]]
          [[ "$runner_uid" -gt 0 && "$runner_gid" -gt 0 ]]
          mkdir -m 0700 "$image_context"
          install -m 0600 dev/thunderbird-private-caldav.Dockerfile "$image_context/Dockerfile"
          docker build --platform linux/amd64 --pull \
            --build-context "radicale-auth=$GITHUB_WORKSPACE/radicale-auth" \
            --build-arg "TASK_UID=$runner_uid" --build-arg "TASK_GID=$runner_gid" \
            --file "$image_context/Dockerfile" --tag "$TB_DOCKER_IMAGE" "$image_context"
          docker image inspect --format '{{.Id}}' "$TB_DOCKER_IMAGE" >/dev/null

      - name: Check closed Thunderbird startup diagnostics offline
        run: python -B dev/test_thunderbird_calendar_smoke.py

      - name: Check the native public ICS worker offline
        run: python -B radicale-auth/tests/test_public_calendar_feed_thunderbird_contract.py

      - name: Check closed public ICS runner evidence offline
        run: python -B dev/test_thunderbird_public_feed_smoke.py

      - name: Check Docker isolation before application download
        id: tb_public_preflight
        run: python -B dev/thunderbird-calendar-smoke.py preflight

      - name: Download and prepare pinned Thunderbird and Marionette artifacts
        id: tb_public_startup_prepare
        run: python -B dev/thunderbird-calendar-smoke.py prepare

      - name: Prepare the public ICS profile and Node runtime
        id: tb_public_profile_prepare
        run: python -B dev/thunderbird-public-feed-smoke.py prepare

      - name: Run native Thunderbird against the anonymous public feed
        id: tb_public_run
        run: python -B dev/thunderbird-public-feed-smoke.py run

      - name: Close public ICS qualification evidence
        if: always()
        env:
          TB_PUBLIC_IMAGE_OUTCOME: ${{ steps.tb_public_image.outcome }}
          TB_PUBLIC_WORKSPACE_OUTCOME: ${{ steps.tb_public_workspace.outcome }}
          TB_PUBLIC_PREFLIGHT_OUTCOME: ${{ steps.tb_public_preflight.outcome }}
          TB_PUBLIC_STARTUP_PREPARE_OUTCOME: ${{ steps.tb_public_startup_prepare.outcome }}
          TB_PUBLIC_PROFILE_PREPARE_OUTCOME: ${{ steps.tb_public_profile_prepare.outcome }}
          TB_PUBLIC_RUN_OUTCOME: ${{ steps.tb_public_run.outcome }}
        run: python3 -B dev/thunderbird-public-feed-smoke.py finalize

      - name: Add the closed public ICS summary to this run
        if: always()
        run: cat "$RUNNER_TEMP/thunderbird-public-feed-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload closed public ICS evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thunderbird-public-ics-summary
          path: ${{ runner.temp }}/thunderbird-public-feed-summary.json
          if-no-files-found: error
          retention-days: 1
