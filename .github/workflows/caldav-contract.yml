name: CalDAV contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/caldav-contract.yml'
      - 'dev/**'
      - 'deploy/etke-sidecar.compose.yaml'
      - 'deploy/etke-sidecar.env.example'
      - 'scripts/validate-sidecar-compose.mjs'
      - 'scripts/validate-sidecar-compose.test.mjs'
      - 'radicale-auth/**'
      - 'matrix-calendar-server/src/caldav/**'
      - 'matrix-calendar-server/src/IAppConfiguration.ts'
      - 'matrix-calendar-server/src/configuration.ts'
      - 'matrix-calendar-server/src/configuration.test.ts'
      - 'matrix-calendar-server/src/controller/CalendarGatewayController.ts'
      - 'matrix-calendar-server/src/app.module.ts'
      - 'matrix-calendar-server/src/controller/RoomReminderConfigurationController.ts'
      - 'matrix-calendar-server/src/controller/RoomReminderConfigurationController.test.ts'
      - 'matrix-calendar-server/src/controller/RoomReminderAlarmOptionsController.ts'
      - 'matrix-calendar-server/src/controller/RoomReminderAlarmOptionsController.test.ts'
      - 'matrix-calendar-server/src/guard/**'
      - 'matrix-calendar-server/src/middleware/**'
      - 'matrix-calendar-server/src/reminder/**'
      - 'matrix-calendar-server/src/service/MatrixCalendarAuthorization.ts'
      - 'matrix-calendar-server/src/service/MatrixCalendarAuthorization.test.ts'
      - 'matrix-calendar-server/src/service/ConfiguredRoomCalendarPrincipalIdentityProvider*'
      - 'matrix-calendar-server/src/service/RoomCalendarPrincipalIdentity.ts'
      - 'matrix-calendar-server/src/service/RoomCalendarEventOperations.ts'
      - 'matrix-calendar-server/src/service/RoomCalendarEventOperations.test.ts'
      - 'matrix-calendar-server/src/service/RoomCalendarCalDavAccess.ts'
      - 'matrix-calendar-server/src/service/RoomCalendarCalDavAccess.test.ts'
      - 'matrix-calendar-server/test/CalendarGatewayMembershipGuard.test.ts'
      - 'matrix-calendar-server/test/integration/CalDavDiscoveryContract.test.ts'
      - 'matrix-calendar-server/test/integration/PersonalOpenIdRadicaleContract.test.ts'
      - 'matrix-calendar-server/test/integration/RoomAppServiceRadicaleContract.test.ts'
      - 'matrix-calendar-server/test/integration/RoomReminderDeliveryContract.test.ts'
      - 'packages/calendar/src/utils/calendarEventTimezone.ts'
      - 'packages/calendar/src/utils/calendarEventTimezone.test.ts'
      - 'matrix-calendar-server/test/integration/CalDavEventRoundTripContract.test.ts'
      - 'matrix-calendar-server/test/integration/CalendarDiagnosticsContract.test.ts'
      - 'matrix-calendar-server/package.json'
      - 'yarn.lock'

permissions:
  contents: read

jobs:
  caldav-contract:
    name: Real Radicale contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_CALENDAR_DEV_USER: calendar
      CALDAV_CONTRACT: '1'
      CALDAV_BASE_URL: http://localhost:5232/
      CALDAV_USERNAME: calendar
      MATRIX_APPLICATION_SERVICE_TOKEN: matrix-calendar-contract-as-token
      MATRIX_APPLICATION_SERVICE_USER_ID: '@_matrix_calendar_service:localhost'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Create and mask isolated Synapse fixture password
        run: |
          fixture_password="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          echo "::add-mask::$fixture_password"
          echo "MATRIX_CALENDAR_DEV_PASSWORD=$fixture_password" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Initialize sanitized contract summary
        run: |
          : > "$RUNNER_TEMP/caldav-safe-contract-summary.txt"

      - name: Test CalDAV report status sanitizer
        run: node --test dev/caldav-contract-status.test.mjs

      - name: Test server Jest report sanitizer
        run: node --test dev/sanitize-server-test-report.test.mjs

      - name: Test fixed CalDAV contract phase sanitizer
        run: node --test dev/sanitize-caldav-contract-stage.test.mjs

      - name: Test Room AppService setup error sanitizer
        run: node --test dev/sanitize-room-appservice-setup.test.mjs

      - name: Test Synapse startup diagnostic sanitizer
        run: node --test dev/synapse-startup-diagnostic.test.mjs

      - name: Test isolated Synapse contract login limits
        run: python3 dev/test_synapse_contract_config.py

      - name: Preflight Personal OpenID contract suite import
        run: |
          CALDAV_CONTRACT=0 \
          yarn workspace @matrix-calendar-widget/server jest \
            test/integration/PersonalOpenIdRadicaleContract.test.ts \
            --runInBand

      - name: Preflight room reminder delivery contract import
        run: |
          CALDAV_CONTRACT=0 \
          yarn workspace @matrix-calendar-widget/server jest \
            test/integration/RoomReminderDeliveryContract.test.ts \
            --runInBand

      - name: Start pinned Matrix and Radicale services
        run: bash dev/up.sh

      - name: Mask synthetic application-service token
        run: echo "::add-mask::$MATRIX_APPLICATION_SERVICE_TOKEN"

      - name: Mint and mask the short-lived Synapse fixture proof
        run: |
          echo "::add-mask::$MATRIX_CALENDAR_DEV_PASSWORD"
          credential="$(node dev/mint-openid-credential.mjs)"
          echo "::add-mask::$credential"
          echo "CALDAV_OPENID_CREDENTIAL=$credential" >> "$GITHUB_ENV"

      - name: Provision VEVENT calendar collection
        run: |
          curl --fail-with-body \
            --user "$CALDAV_USERNAME:$CALDAV_OPENID_CREDENTIAL" \
            --request MKCALENDAR \
            --header 'Content-Type: application/xml; charset=utf-8' \
            --data-binary @- \
            "http://localhost:5232/$CALDAV_USERNAME/contract-calendar/" <<'XML'
          <?xml version="1.0" encoding="utf-8" ?>
          <C:mkcalendar xmlns:C="urn:ietf:params:xml:ns:caldav" xmlns:D="DAV:">
            <D:set>
              <D:prop>
                <D:displayname>Contract Calendar</D:displayname>
                <C:supported-calendar-component-set>
                  <C:comp name="VEVENT"/>
                </C:supported-calendar-component-set>
              </D:prop>
            </D:set>
          </C:mkcalendar>
          XML

      - name: Run gateway and real CalDAV contracts
        run: |
          set +e
          contract_log="$RUNNER_TEMP/caldav-contract-output.log"
          contract_report="$RUNNER_TEMP/caldav-contract-results.json"
          contract_stage_file="$RUNNER_TEMP/caldav-contract-stage.txt"
          : > "$contract_stage_file"
          CALDAV_CONTRACT_STAGE_FILE="$contract_stage_file" \
          yarn workspace @matrix-calendar-widget/server jest \
            test/CalendarGatewayMembershipGuard.test.ts \
            test/integration/PersonalOpenIdRadicaleContract.test.ts \
            test/integration/RoomAppServiceRadicaleContract.test.ts \
            test/integration/RoomReminderDeliveryContract.test.ts \
            test/integration/CalDavDiscoveryContract.test.ts \
            test/integration/CalDavEventRoundTripContract.test.ts \
            test/integration/CalendarDiagnosticsContract.test.ts \
            --runInBand --json --outputFile="$contract_report" \
            > "$contract_log" 2>&1
          test_status=$?
          set -e
          set +e
          node dev/assert-caldav-contract-logs.mjs \
            "$contract_log" "$contract_report"
          scan_status=$?
          contract_report_summary="$(node dev/sanitize-server-test-report.mjs \
            "$contract_report" "$test_status" 2>/dev/null)"
          report_summary_status=$?
          contract_setup_summary="$(node dev/sanitize-room-appservice-setup.mjs \
            "$contract_report" "$contract_stage_file" 2>/dev/null)"
          contract_setup_summary_status=$?
          contract_summary="$(node dev/sanitize-caldav-contract-stage.mjs "$contract_stage_file")"
          printf '%s\n' "$contract_summary"
          printf '%s\n' "$contract_report_summary"
          printf '%s\n' "$contract_setup_summary"
          {
            printf '%s\n' 'Real CalDAV contract stages'
            printf '%s\n' "$contract_summary"
            printf '%s\n' 'Real CalDAV test summary'
            printf '%s\n' "$contract_report_summary"
            printf '%s\n' 'Personal, Room, and reminder setup diagnosis'
            printf '%s\n' "$contract_setup_summary"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf '%s\n' 'Real CalDAV contract stages'
            printf '%s\n' "$contract_summary"
            printf '%s\n' 'Real CalDAV test summary'
            printf '%s\n' "$contract_report_summary"
            printf '%s\n' 'Personal, Room, and reminder setup diagnosis'
            printf '%s\n' "$contract_setup_summary"
          } >> "$RUNNER_TEMP/caldav-safe-contract-summary.txt"
          rm -f "$contract_log" "$contract_report"
          rm -f "$contract_stage_file"
          set -e
          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi
          if [ "$report_summary_status" -ne 0 ]; then
            exit "$report_summary_status"
          fi
          if [ "$contract_setup_summary_status" -ne 0 ]; then
            exit "$contract_setup_summary_status"
          fi
          exit "$test_status"

      - name: Start a fresh Synapse fixture without AS registration
        run: |
          docker compose -f dev/compose.yaml down -v --remove-orphans
          MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION=disabled bash dev/up.sh
          echo "::add-mask::$MATRIX_CALENDAR_DEV_PASSWORD"
          credential="$(node dev/mint-openid-credential.mjs)"
          echo "::add-mask::$credential"
          echo "CALDAV_OPENID_CREDENTIAL=$credential" >> "$GITHUB_ENV"

      - name: Run the normal bot-account room CalDAV contract without AS
        run: |
          set +e
          contract_log="$RUNNER_TEMP/normal-bot-contract-output.log"
          contract_report="$RUNNER_TEMP/normal-bot-contract-results.json"
          contract_stage_file="$RUNNER_TEMP/normal-bot-contract-stage.txt"
          : > "$contract_stage_file"
          env \
            -u MATRIX_APPLICATION_SERVICE_TOKEN \
            -u MATRIX_APPLICATION_SERVICE_USER_ID \
            CALDAV_CONTRACT=1 \
            ROOM_CALENDAR_PRINCIPAL_MODE=bot-account \
            MATRIX_CALENDAR_DEV_APPSERVICE_REGISTRATION=disabled \
            CALDAV_CONTRACT_STAGE_FILE="$contract_stage_file" \
            yarn workspace @matrix-calendar-widget/server jest \
              test/integration/RoomAppServiceRadicaleContract.test.ts \
              --runInBand --json --outputFile="$contract_report" \
              > "$contract_log" 2>&1
          test_status=$?
          set -e
          set +e
          node dev/assert-caldav-contract-logs.mjs \
            "$contract_log" "$contract_report"
          scan_status=$?
          contract_report_summary="$(node dev/sanitize-server-test-report.mjs \
            "$contract_report" "$test_status" 2>/dev/null)"
          report_summary_status=$?
          contract_setup_summary="$(node dev/sanitize-room-appservice-setup.mjs \
            "$contract_report" "$contract_stage_file" 2>/dev/null)"
          contract_setup_summary_status=$?
          contract_summary="$(node dev/sanitize-caldav-contract-stage.mjs "$contract_stage_file")"
          printf '%s\n' "$contract_summary"
          printf '%s\n' "$contract_report_summary"
          printf '%s\n' "$contract_setup_summary"
          {
            printf '%s\n' 'AS-free normal bot-account room contract stages'
            printf '%s\n' "$contract_summary"
            printf '%s\n' 'AS-free normal bot-account room contract test summary'
            printf '%s\n' "$contract_report_summary"
            printf '%s\n' 'Normal bot-account setup diagnosis'
            printf '%s\n' "$contract_setup_summary"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf '%s\n' 'AS-free normal bot-account room contract stages'
            printf '%s\n' "$contract_summary"
            printf '%s\n' 'AS-free normal bot-account room contract test summary'
            printf '%s\n' "$contract_report_summary"
            printf '%s\n' 'Normal bot-account setup diagnosis'
            printf '%s\n' "$contract_setup_summary"
          } >> "$RUNNER_TEMP/caldav-safe-contract-summary.txt"
          rm -f "$contract_log" "$contract_report" "$contract_stage_file"
          set -e
          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi
          if [ "$report_summary_status" -ne 0 ]; then
            exit "$report_summary_status"
          fi
          if [ "$contract_setup_summary_status" -ne 0 ]; then
            exit "$contract_setup_summary_status"
          fi
          exit "$test_status"

      - name: Stop services
        if: always()
        run: docker compose -f dev/compose.yaml down -v --remove-orphans

      - name: Upload sanitized contract diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caldav-safe-contract-diagnostics
          path: ${{ runner.temp }}/caldav-safe-contract-summary.txt
          if-no-files-found: ignore
          retention-days: 1
