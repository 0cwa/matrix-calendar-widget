name: matrix-calendar-dev

services:
  synapse:
    image: ghcr.io/element-hq/synapse:v1.161.0
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: 'no'
    ports:
      - '8008:8008'
    volumes:
      - synapse-data:/data
      - ./appservice-calendar-contract.yaml:/data/appservice-calendar-contract.yaml:ro
      - ./synapse_contract_config.py:/data/synapse_contract_config.py:ro

  radicale:
    image: matrix-calendar-widget/radicale-openid:3.8.0.0
    build:
      context: ../radicale-auth
      dockerfile: Dockerfile
    depends_on:
      - synapse
    environment:
      RADICALE_MATRIX_HOMESERVER_URL: 'http://synapse:8008'
      RADICALE_MATRIX_SERVER_NAME: localhost
    ports:
      - '5232:5232'
    volumes:
      - radicale-data:/data

volumes:
  synapse-data:
  radicale-data:
